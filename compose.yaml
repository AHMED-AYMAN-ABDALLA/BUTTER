# On the server: docker compose up -d
# Watchtower checks for a new image every 5 minutes and restarts the site with it,
# so every push to main reaches the server by itself.
services:
  butter:
    image: ghcr.io/ahmed-ayman-abdalla/butter:latest
    container_name: butter
    ports:
      - "8080:80"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: butter-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 300
    restart: unless-stopped
