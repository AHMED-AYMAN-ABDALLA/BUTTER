<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2EFF6; --surface:#FFFFFF; --ink:#211B2C; --muted:#665D74; --line:#DCD5E6;
  --accent:#5A3E8E; --accent-soft:#ECE5F6; --amber:#9A5B12; --amber-soft:#FAEEDC;
  --ok:#2C7A4B; --ok-soft:#DFF1E6; --bad:#B0372E; --bad-soft:#F8E1DE;
  --f-display:"Alexandria","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121B; --surface:#1E1A26; --ink:#ECE7F3; --muted:#A79DB6; --line:#342D40;
  --accent:#B9A2E6; --accent-soft:#2C2440; --amber:#E7AE5A; --amber-soft:#382A17;
  --ok:#6CCB91; --ok-soft:#173226; --bad:#EE8A80; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121B; --surface:#1E1A26; --ink:#ECE7F3; --muted:#A79DB6; --line:#342D40;
  --accent:#B9A2E6; --accent-soft:#2C2440; --amber:#E7AE5A; --amber-soft:#382A17;
  --ok:#6CCB91; --ok-soft:#173226; --bad:#EE8A80; --bad-soft:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;overflow-x:hidden}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
p{margin:0}
bdi.en,.en{direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent);letter-spacing:.02em}
.bar .sp{flex:1}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.ibtn:hover{color:var(--accent);border-color:var(--accent)}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer}
h1{font-size:clamp(26px,6vw,38px)}
.lead{color:var(--muted);max-width:62ch}
/* course grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:start;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:15px}
.card h3{font-size:17px}
.card .meta{font-size:13px;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:14.5px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
/* chapter + lesson */
.chap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ch-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.ch-h:focus-visible,.lh:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;border-radius:14px}
.num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--accent-soft);color:var(--accent)}
.chap.done .num{background:var(--ok);color:var(--surface)}
.eyebrow{font-size:12.5px;color:var(--muted)}
.ch-h h2{font-size:18.5px}
.ch-h .grow{flex:1;min-width:0}
.chev{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.open>.ch-h .chev,.lesson.open>.lh .chev{transform:rotate(180deg);color:var(--accent)}
.ch-b{display:none;padding:0 16px 16px;flex-direction:column;gap:12px}
.chap.open>.ch-b{display:flex}
.lesson{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.lh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.lh h3{font-size:16px;flex:1}
.lh .tick{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.lesson.done .tick{background:var(--ok-soft);color:var(--ok)}
.lb{display:none;padding:0 14px 18px;flex-direction:column}
.lesson.open .lb{display:flex}
.idea{font-family:var(--f-display);font-size:17px;font-weight:500;line-height:1.75;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.step{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;padding-top:16px}
.step::before{content:"";position:absolute;top:44px;bottom:-16px;inset-inline-start:13px;width:2px;background:var(--line)}
.step:last-of-type::before{display:none}
.sn{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface);position:relative;z-index:1}

/* ---------- general courses engine ---------- */
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='gen-study-v1', TKEY='gen-theme';
let ST={done:{},best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')ST=Object.assign(ST,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
const AR='٠١٢٣٤٥٦٧٨٩';
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر'];
// deterministic shuffle
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>{let x=hash(seed)||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}};
const shuffle=(a,seed)=>{const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const norm=s=>String(s).replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/[.,،؛:!؟?"'()«»\-–]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const chLabel=n=>`الشابتر ${n}`;

const RNG=/\d[\d.,]*\s?[–-]\s?\d[\d.,]*(?:\s?[٪%])?/g;
function bidiNums(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest('bdi,textarea,input,select,option')?2:RNG.test(n.nodeValue)?(RNG.lastIndex=0,1):2});const ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{RNG.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;const t=n.nodeValue;while((m=RNG.exec(t))){f.append(t.slice(last,m.index));const b=document.createElement('bdi');b.dir='ltr';b.textContent=m[0];f.append(b);last=RNG.lastIndex}f.append(t.slice(last));n.replaceWith(f)})}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));const p=Object.fromEntries(h.split('&').filter(Boolean).map(x=>x.split('=')));
  const c=COURSES.find(x=>x.id===p.c);
  if(!c)return home();
  course(c,p.t||'ch',+p.ch||0);
  bidiNums($('#app'));
}
const go=(h)=>{if(location.hash.slice(1)===h)route();else location.hash=h};
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

function bar(){
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
  return `<div class="bar"><span class="brand">زبدة · المواد العامة</span><span class="sp"></span><button class="ibtn" id="theme" aria-label="تبديل المظهر">${dark?'☀ فاتح':'☾ داكن'}</button></div>`;
}
function bindBar(){
  $('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
    r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(TKEY,r.dataset.theme)}catch(e){}$('#theme').textContent=dark?'☾ داكن':'☀ فاتح'};
}
const lessonKey=(c,ci,li)=>`${c.id}:${ci}:${li}`;
function courseProgress(c){let n=0,d=0;c.chapters.forEach((ch,ci)=>ch.ls.forEach((l,li)=>{n++;if(ST.done[lessonKey(c,ci,li)])d++}));return n?d/n:0}

const cStats=c=>{let ls=0,q=0;c.chapters.forEach(ch=>{ls+=ch.ls.length;q+=ch.bank.length+(ch.wr||[]).length;ch.ls.forEach(l=>q+=l.quiz.length)});return {ch:c.chapters.length,ls,q,ex:(c.exams||[]).length+(c.practice||[]).length}};
function home(){
  document.title='المواد العامة';delete document.documentElement.dataset.c;
  const T=COURSES.reduce((a,c)=>{const s=cStats(c);a.ch+=s.ch;a.q+=s.q;a.ex+=s.ex;return a},{ch:0,q:0,ex:0});
  $('#app').innerHTML=bar()+`<header class="hero home-hero"><h1>المواد العامة</h1>
  <div class="stats"><span><b>${COURSES.length}</b>مواد</span><span><b>${T.ch}</b>شابتر</span><span><b>${T.q}</b>سؤال</span><span><b>${T.ex}</b>نموذج اختبار</span></div></header>
  <div class="grid">${COURSES.map(c=>{const p=courseProgress(c),st=cStats(c);return `<button class="card c-${c.id}" data-c="${c.id}"><span class="band"><span class="ic">${esc(c.ic)}</span>${c.code?`<bdi class="code">${esc(c.code)}</bdi>`:''}</span><span class="cb"><h3>${esc(c.name)}</h3><span class="tagl">${esc(c.desc.split('،')[0])}</span><span class="meta">${st.ch} شابترات · ${st.q} سؤال · ${st.ex} نماذج</span><span class="pbar"><i style="width:${Math.round(p*100)}%"></i></span><span class="meta">مكتمل <bdi dir="ltr">${Math.round(p*100)}%</bdi></span></span></button>`}).join('')}</div>`;
  bindBar();
  $$('.card').forEach(b=>b.onclick=()=>go('c='+b.dataset.c));

function course(c,tab,chSel){
  document.title=c.name+' · المواد العامة';document.documentElement.dataset.c=c.id;
  const st=cStats(c),pr=Math.round(courseProgress(c)*100);

  <header class="hero"><div class="hrow"><span class="ic big">${esc(c.ic)}</span><div>${c.code?`<p class="kick"><bdi>${esc(c.code)}</bdi></p>`:''}<h1>${esc(c.name)}</h1></div></div>
  <div class="stats"><span><b>${st.ch}</b>شابتر</span><span><b>${st.ls}</b>درس</span><span><b>${st.q}</b>سؤال</span><span><b>${st.ex}</b>نموذج</span></div>
  <div class="hprog"><span class="pbar"><i style="width:${pr}%"></i></span><span>مكتمل <bdi dir="ltr">${pr}%</bdi></span></div></header>
  <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button class="tab${k===tab?' on':''}" role="tab" aria-selected="${k===tab}" data-t="${k}">${t}</button>`).join('')}</div>
  <section id="body" class="sec"></section>`;
  bindBar();
  $('[data-home]').onclick=()=>go('');
  $$('.tab').forEach(b=>b.onclick=()=>go(`c=${c.id}&t=${b.dataset.t}`));
  const body=$('#body');
  if(tab==='ch')chapters(c,body,chSel);else if(tab==='test')chapterTests(c,body,chSel);else exams(c,body);

/* ---------- chapters + lessons ---------- */
function chapters(c,body,chSel){
  body.innerHTML=c.chapters.map((ch,ci)=>{const all=ch.ls.every((l,li)=>ST.done[lessonKey(c,ci,li)]);
    return `<article class="chap${all?' done':''}${chSel===ci+1?' open':''}" id="ch${ci+1}"><div class="ch-h" tabindex="0" role="button" aria-expanded="${chSel===ci+1}"><span class="num">${ci+1}</span><div class="grow"><p class="eyebrow">${chLabel(ci+1)}${ch.ls.length>1?` · ${ch.ls.length} دروس`:''}</p><h2>${esc(ch.t)}</h2></div><span class="chev">▾</span></div>
    <div class="ch-b">${ch.ls.map((l,li)=>`<div class="lesson${ST.done[lessonKey(c,ci,li)]?' done':''}${ch.ls.length===1?' open':''}" data-ci="${ci}" data-li="${li}"><div class="lh" tabindex="0" role="button"><h3>${esc(l.t)}</h3><span class="tick">${ST.done[lessonKey(c,ci,li)]?'✓ تمّ':'لم يكتمل'}</span><span class="chev">▾</span></div><div class="lb"></div></div>`).join('')}
    <div class="row"><button class="btn ghost" data-test="${ci+1}">اختبار ${chLabel(ci+1)} ←</button></div></div></article>`}).join('');
  const toggle=(el,open)=>{el.classList.toggle('open',open);const h=el.querySelector(':scope>.ch-h,:scope>.lh');if(h)h.setAttribute('aria-expanded',open);if(open)fillLessons(el)};
  const fillLessons=el=>$$('.lesson.open',el).concat(el.classList.contains('lesson')&&el.classList.contains('open')?[el]:[]).forEach(L=>{const lb=$('.lb',L);if(!lb.dataset.f){lb.dataset.f=1;lesson(c,+L.dataset.ci,+L.dataset.li,lb)}});
  $$('.chap',body).forEach(a=>{const h=$('.ch-h',a);const f=()=>{toggle(a,!a.classList.contains('open'))};h.onclick=f;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}};if(a.classList.contains('open'))fillLessons(a)});
  $$('.lesson',body).forEach(L=>{const h=$('.lh',L);const f=()=>toggle(L,!L.classList.contains('open'));h.onclick=f;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
  $$('[data-test]',body).forEach(b=>b.onclick=()=>go(`c=${c.id}&t=test&ch=${b.dataset.test}`));
  if(chSel){const el=$('#ch'+chSel);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),0)}
}

function step(n,title,html){return `<div class="step"><span class="sn">${n}</span><div class="sc"><h4>${title}</h4>${html}</div></div>`}
function lesson(c,ci,li,lb){
  const l=c.chapters[ci].ls[li];let n=0;const S=[];
  S.push(`<p class="idea">${l.idea}</p>`);
  if(l.what)S.push(step(++n,'الشرح',l.what));
  if(l.how)S.push(step(++n,'كيف يجيك بالاختبار',l.how));
  if(l.fmt)S.push(step(++n,'الخلاصة للحفظ',l.fmt));
  if(l.demo)S.push(step(++n,'جرّب بنفسك',`<div class="lab" data-w="demo"></div>`));
  if(l.errs&&l.errs.length)S.push(step(++n,'أخطاء شائعة',`<ul class="errs">${l.errs.map(([w,r])=>`<li><span class="w">${w}</span><span class="r">${r}</span></li>`).join('')}</ul>`));
  if(l.exam&&l.exam.length)S.push(step(++n,'للاختبار',`<div class="exam"><ol>${l.exam.map(x=>`<li>${x}</li>`).join('')}</ol></div>`));
  lb.innerHTML=S.join('')+`<div class="box" data-quiz><div class="boxh"><h4>اختبار قصير (${l.quiz.length} أسئلة)</h4><span data-sc></span></div><ol class="qs"></ol></div>`+
    (l.task?`<div class="box"><div class="boxh"><h4>طبّق</h4><span>${esc(l.task.title||'')}</span></div><div class="lab" data-w="task"></div><div class="row"><button class="btn" data-done>${ST.done[lessonKey(c,ci,li)]?'✓ الدرس مكتمل':'علّم الدرس كمكتمل'}</button></div></div>`:
    `<div class="row" style="margin-top:14px"><button class="btn" data-done>${ST.done[lessonKey(c,ci,li)]?'✓ الدرس مكتمل':'علّم الدرس كمكتمل'}</button></div>`);
  if(l.demo)widget(l.demo,$('[data-w=demo]',lb),lessonKey(c,ci,li)+'d');
  if(l.task)widget(l.task,$('[data-w=task]',lb),lessonKey(c,ci,li)+'t');
  quizInstant(l.quiz,$('[data-quiz]',lb),lessonKey(c,ci,li),ci+1);
  bidiNums(lb);
  $('[data-done]',lb).onclick=e=>{const k=lessonKey(c,ci,li);ST.done[k]=!ST.done[k];save();e.target.textContent=ST.done[k]?'✓ الدرس مكتمل':'علّم الدرس كمكتمل';
    const L=lb.closest('.lesson');L.classList.toggle('done',!!ST.done[k]);$('.tick',L).textContent=ST.done[k]?'✓ تمّ':'لم يكتمل';
    const A=lb.closest('.chap');A.classList.toggle('done',c.chapters[ci].ls.every((x,j)=>ST.done[lessonKey(c,ci,j)]))};
}

/* ---------- questions ---------- */
const LET=['أ','ب','ج','د','هـ','و'];
function optsHtml(q,qid){
  if(q.o==='TF')return `<div class="opts tf">${['صح','خطأ'].map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${k?'✗':'✓'}</span><span>${t}</span></button>`).join('')}</div>`;
  return `<div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${LET[k]}</span><span>${t}</span></button>`).join('')}</div>`;
}
const correctIdx=q=>q.o==='TF'?(q.a?0:1):q.a;
function qHtml(q,i,ch,src){
  return `<li class="q" data-i="${i}"><div class="qch">${ch?`<span>${chLabel(ch)}</span>`:''}${src?`<span class="src">${src}</span>`:''}</div><p class="qt"><span class="n">${i+1}.</span>${q.s}</p>${optsHtml(q)}<p class="expl">${q.e||''}</p></li>`;
}
function quizInstant(qs,box,key,ch){
  const ol=$('.qs',box);ol.innerHTML=qs.map((q,i)=>qHtml(q,i,ch)).join('');let got=0,ans=0;
  const sc=$('[data-sc]',box);const upd=()=>{sc.innerHTML=ans?`<span class="score">${got}/${qs.length}</span>`:''};upd();
  $$('.q',ol).forEach(li=>{const q=qs[+li.dataset.i];$$('.opt',li).forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,r=correctIdx(q);$$('.opt',li).forEach(x=>{x.disabled=true;const kk=+x.dataset.k;if(kk===r)x.classList.add('right');else if(kk===k)x.classList.add('wrong')});
    li.classList.add('shown');ans++;if(k===r)got++;upd();if(ans===qs.length){ST.best[key]=Math.max(ST.best[key]||0,got);save()}})});
}
function gradedList(items,ol,seed){ // items: [{q,ch,src}]
  ol.innerHTML=items.map((x,i)=>qHtml(x.q,i,x.ch,x.src)).join('');
  $$('.q',ol).forEach(li=>$$('.opt',li).forEach(b=>b.onclick=()=>{if(li.dataset.g)return;$$('.opt',li).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');li.dataset.sel=b.dataset.k}));
  return ()=>{let got=0;$$('.q',ol).forEach(li=>{const x=items[+li.dataset.i],r=correctIdx(x.q),k=li.dataset.sel===undefined?-1:+li.dataset.sel;li.dataset.g=1;
    $$('.opt',li).forEach(o=>{o.disabled=true;const kk=+o.dataset.k;if(kk===r)o.classList.add('right');else if(kk===k)o.classList.add('wrong')});li.classList.add('shown');if(k===r)got++});return got};
}

/* ---------- chapter tests ---------- */
function chapterTests(c,body,chSel){
  const sel=chSel||1;
  body.innerHTML=`<label class="row"><span>اختر الشابتر:</span><select id="chsel" style="width:auto;flex:1;min-width:200px">${c.chapters.map((ch,i)=>`<option value="${i+1}"${i+1===sel?' selected':''}>${chLabel(i+1)} · ${esc(ch.t)}</option>`).join('')}</select></label><div id="tbox"></div>`;
  $('#chsel').onchange=e=>go(`c=${c.id}&t=test&ch=${e.target.value}`);
  const ch=c.chapters[sel-1];
  const items=shuffle(ch.bank.map(q=>({q,ch:sel})),c.id+sel);
  const wr=(ch.wr||[]).map(w=>({w,ch:sel}));
  const key=`${c.id}:test:${sel}`;
  $('#tbox').innerHTML=`<div class="box"><div class="boxh"><h4>اختبار ${chLabel(sel)}: ${esc(ch.t)}</h4><span>${items.length} سؤال${wr.length?` + ${wr.length} مقالي`:''}${ST.best[key]!==undefined?` · أفضل نتيجة: ${ST.best[key]}/${items.length}`:''}</span></div>
   <ol class="qs" id="tq"></ol>${wr.length?`<div class="sec"><p class="sech">أسئلة مقالية <span>قيّم نفسك بالإجابة النموذجية</span></p>${wrHtml(wr,0)}</div>`:''}
   <div class="row"><button class="btn" id="grade">صحّح الاختبار</button><button class="btn ghost" id="again" hidden>أعد الاختبار</button><span id="res"></span></div></div>`;
  const grade=gradedList(items,$('#tq'));bindWr($('#tbox'));
  $('#grade').onclick=()=>{const g=grade();ST.best[key]=Math.max(ST.best[key]||0,g);save();$('#res').innerHTML=`<span class="score">${g}/${items.length}</span> ${g/items.length>=.8?'ممتاز':g/items.length>=.6?'جيد، راجع الأخطاء':'ارجع للشرح وأعد'}`;$('#grade').disabled=true;$('#again').hidden=false};
  $('#again').onclick=()=>chapterTests(c,body,sel);
}
function wrHtml(wr,start){return `<ol class="qs">${wr.map((x,i)=>`<li class="q"><div class="qch">${x.ch?`<span>${chLabel(x.ch)}</span>`:''}${x.src?`<span class="src">${x.src}</span>`:''}</div><p class="qt"><span class="n">${start+i+1}.</span>${x.w.w}</p><textarea placeholder="اكتب إجابتك هنا…"></textarea><div class="row"><button class="btn ghost" data-m>اعرض الإجابة النموذجية</button></div><div class="model" hidden>${x.w.m}</div></li>`).join('')}</ol>`}
function bindWr(root){$$('[data-m]',root).forEach(b=>b.onclick=()=>{const m=b.parentElement.nextElementSibling;m.hidden=!m.hidden;b.textContent=m.hidden?'اعرض الإجابة النموذجية':'أخفِ الإجابة'})}

/* ---------- exam models ---------- */
function buildPractice(c,p){
  const chs=p.chs||c.chapters.map((_,i)=>i+1);
  const mcPool=[],tfPool=[],wPool=[];
  chs.forEach(n=>{const ch=c.chapters[n-1];ch.bank.forEach(q=>(q.o==='TF'?tfPool:mcPool).push({q,ch:n}));(ch.wr||[]).forEach(w=>wPool.push({w,ch:n}))});
  const pick=(pool,k,seed)=>{ // spread across chapters
    const by={};pool.forEach(x=>(by[x.ch]=by[x.ch]||[]).push(x));Object.keys(by).forEach(k2=>by[k2]=shuffle(by[k2],seed+k2));
    const out=[];let i=0;const keys=Object.keys(by);while(out.length<k&&keys.some(k2=>by[k2].length)){const k2=keys[i%keys.length];if(by[k2].length)out.push(by[k2].shift());i++}
    return out.sort((a,b)=>a.ch-b.ch)};
  return {mc:pick(mcPool,p.mc||15,p.seed+'m'),tf:pick(tfPool,p.tf||10,p.seed+'t'),wr:pick(wPool,p.wr||2,p.seed+'w')};
}
function exams(c,body){
  const models=[...(c.exams||[]).map(e=>({...e,kind:'real'})),...(c.practice||[]).map(p=>({...p,kind:'pr',...buildPractice(c,p)}))];
  if(!models.length){body.innerHTML='<p class="empty">لا توجد نماذج بعد.</p>';return}
  body.innerHTML=``+models.map((m,n)=>`<article class="chap model-card" id="m${n}"><div class="ch-h" tabindex="0" role="button"><span class="num">${n+1}</span><div class="grow"><p class="eyebrow"><span class="mtag ${m.kind==='real'?'real':'pr'}">${m.kind==='real'?'اختبار سابق':'نموذج تدريبي'}</span>${m.freq?` · ${esc(m.freq)}`:''}</p><h2>${esc(m.title)}</h2></div><span class="chev">▾</span></div><div class="ch-b"></div></article>`).join('');
  $$('.model-card',body).forEach((a,n)=>{const h=$('.ch-h',a);const f=()=>{a.classList.toggle('open');if(a.classList.contains('open')&&!a.dataset.f){a.dataset.f=1;model(c,models[n],$('.ch-b',a),n)}};h.onclick=f;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
}
function model(c,m,el,n){
  const src=m.kind==='real'?(m.src||'اختبار سابق'):'';
  const mc=(m.mc||[]).map(x=>({...x,src:x.src||src})),tf=(m.tf||[]).map(x=>({...x,src:x.src||src})),wr=(m.wr||[]).map(x=>({...x,src:x.src||src}));
  let qn=0;const parts=[];
  
  if(mc.length)parts.push(`<div class="sec"><p class="sech">السؤال ${ORD[qn++]}: اختر الإجابة الصحيحة <span>${mc.length} درجة</span></p><ol class="qs" data-p="mc"></ol></div>`);
  if(tf.length)parts.push(`<div class="sec"><p class="sech">السؤال ${ORD[qn++]}: ضع (صح) أو (خطأ) <span>${tf.length} درجة</span></p><ol class="qs" data-p="tf"></ol></div>`);
  if(mc.length||tf.length)parts.push(`<div class="row"><button class="btn" data-g>صحّح الاختيار والصح/خطأ</button><span data-r></span></div>`);
  if(wr.length)parts.push(`<div class="sec"><p class="sech">السؤال ${ORD[qn++]}: أجب عما يلي <span>تقييم ذاتي</span></p>${wrHtml(wr,0)}</div>`);
  el.innerHTML=parts.join('');
  const gs=[];if(mc.length)gs.push(gradedList(mc,$('[data-p=mc]',el)));if(tf.length)gs.push(gradedList(tf,$('[data-p=tf]',el)));
  bindWr(el);bidiNums(el);
  const g=$('[data-g]',el);if(g)g.onclick=()=>{const got=gs.reduce((s,f)=>s+f(),0),tot=mc.length+tf.length;$('[data-r]',el).innerHTML=`<span class="score">${got}/${tot}</span>`;g.disabled=true;
    const key=`${c.id}:ex:${m.title}`;ST.best[key]=Math.max(ST.best[key]||0,got);save()};
}

/* ---------- widgets: demo + task ---------- */
function widget(w,el,seed){
  const T=W_TYPES[w.type];if(!T){el.innerHTML='';return}
  el.innerHTML=(w.tip?`<p class="tip">${w.tip}</p>`:'')+'<div data-in></div>';T($('[data-in]',el),w,seed);
}
const msg=(el,ok,t)=>{el.className='msg '+(ok?'ok':'bad');el.innerHTML=t};
const W_TYPES={
  flip(el,w){el.innerHTML=`<div class="flips">${w.items.map(([f,b])=>`<button class="flip"><span class="f">${f}</span><span class="b">${b}</span></button>`).join('')}</div>`;
    $$('.flip',el).forEach(b=>b.onclick=()=>b.classList.toggle('on'))},
  order(el,w,seed){let cur=shuffle(w.items.map((t,i)=>i),seed);if(cur.every((v,i)=>v===i))cur.reverse();
    const draw=()=>{el.innerHTML=`<ol class="olist">${cur.map((k,i)=>`<li data-k="${k}"><button class="mv" data-u="${i}" aria-label="لفوق"${i?'':' disabled'}>▲</button><button class="mv" data-d="${i}" aria-label="لتحت"${i<cur.length-1?'':' disabled'}>▼</button><span class="t">${w.items[k]}</span></li>`).join('')}</ol><div class="row"><button class="btn" data-c>تحقق من الترتيب</button><span data-m></span></div>`;
      $$('[data-u]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.u;[cur[i-1],cur[i]]=[cur[i],cur[i-1]];draw()});
      $$('[data-d]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.d;[cur[i+1],cur[i]]=[cur[i],cur[i+1]];draw()});
      $('[data-c]',el).onclick=()=>{let ok=0;$$('.olist li',el).forEach((li,i)=>{const g=+li.dataset.k===i;li.classList.add(g?'ok':'bad');if(g)ok++});
        msg($('[data-m]',el),ok===cur.length,ok===cur.length?'ترتيب صحيح ✓':`${ok} من ${cur.length} في مكانها الصحيح. رتّب الأحمر وجرّب مرة ثانية.`)}};draw()},
  match(el,w,seed){const R=shuffle(w.pairs.map((p,i)=>i),seed);
    el.innerHTML=w.pairs.map(([a],i)=>`<div class="mrow" data-i="${i}"><span>${a}</span><select><option value="">اختر…</option>${R.map(k=>`<option value="${k}">${w.pairs[k][1].replace(/<[^>]+>/g,'')}</option>`).join('')}</select></div>`).join('')+`<div class="row"><button class="btn" data-c>تحقق</button><span data-m></span></div>`;
    $('[data-c]',el).onclick=()=>{let ok=0;$$('.mrow',el).forEach(r=>{const g=$('select',r).value===r.dataset.i;r.classList.remove('ok','bad');r.classList.add(g?'ok':'bad');if(g)ok++});msg($('[data-m]',el),ok===w.pairs.length,`${ok}/${w.pairs.length} صح`)}},
  classify(el,w,seed){const it=shuffle(w.items.map((x,i)=>i),seed);
    el.innerHTML=it.map(i=>`<div class="mrow" data-i="${i}"><span>${w.items[i][0]}</span><select><option value="">اختر…</option>${w.cats.map((c,k)=>`<option value="${k}">${c}</option>`).join('')}</select></div>`).join('')+`<div class="row"><button class="btn" data-c>تحقق</button><span data-m></span></div>`;
    $('[data-c]',el).onclick=()=>{let ok=0;$$('.mrow',el).forEach(r=>{const g=$('select',r).value===String(w.items[+r.dataset.i][1]);r.classList.remove('ok','bad');r.classList.add(g?'ok':'bad');if(g)ok++});msg($('[data-m]',el),ok===w.items.length,`${ok}/${w.items.length} صح`)}},
  fill(el,w){el.innerHTML=`<div class="fill">${w.items.map(([p],i)=>`<div class="fi" data-i="${i}"><span>${p}</span><input type="text" aria-label="الإجابة"><small hidden></small></div>`).join('')}</div><div class="row"><button class="btn" data-c>تحقق</button><button class="btn ghost" data-s>اعرض الإجابات</button><span data-m></span></div>`;
    const ok=(v,a)=>(Array.isArray(a)?a:[a]).some(x=>norm(v)===norm(x)||norm(v).replace(/^ال/,'')===norm(x).replace(/^ال/,''));
    $('[data-c]',el).onclick=()=>{let n=0;$$('.fi',el).forEach(f=>{const a=w.items[+f.dataset.i][1],g=ok($('input',f).value,a);f.classList.remove('ok','bad');f.classList.add(g?'ok':'bad');if(g)n++});msg($('[data-m]',el),n===w.items.length,`${n}/${w.items.length} صح`)};
    $('[data-s]',el).onclick=()=>$$('.fi',el).forEach(f=>{const a=w.items[+f.dataset.i][1];const s=$('small',f);s.hidden=false;s.textContent='الإجابة: '+(Array.isArray(a)?a[0]:a)})},
  write(el,w){el.innerHTML=`<p>${w.prompt}</p><textarea placeholder="اكتب إجابتك…"></textarea><div class="row"><button class="btn ghost" data-m>اعرض الإجابة النموذجية</button></div><div class="model" hidden>${w.model}</div>`;
    $('[data-m]',el).onclick=e=>{const m=$('.model',el);m.hidden=!m.hidden;e.target.textContent=m.hidden?'اعرض الإجابة النموذجية':'أخفِ الإجابة'}},
  calc(el,w){(CALCS[w.id]||(()=>{}))(el,w)}
};
const num=v=>parseFloat(String(v).replace(/[٠-٩]/g,d=>AR.indexOf(d)));
const CALCS={
  bmi(el){el.innerHTML=`<div class="calc"><label>الوزن (كجم)<input type="number" data-a value="70" min="1"></label><label>الطول (سم)<input type="number" data-b value="170" min="50"></label></div><p class="out" data-o></p>`;
    const f=()=>{const kg=num($('[data-a]',el).value),m=num($('[data-b]',el).value)/100;if(!(kg>0&&m>0))return $('[data-o]',el).textContent='اكتب أرقام صحيحة';const b=kg/(m*m);
      const c=b<18.5?'أقل من الطبيعي (نحافة)':b<25?'وزن طبيعي':b<30?'زيادة وزن':b<35?'سمنة درجة أولى':b<40?'سمنة درجة ثانية':'سمنة مفرطة';
      $('[data-o]',el).textContent=`مؤشر كتلة الجسم = ${kg} ÷ (${m.toFixed(2)})² = ${b.toFixed(1)} ← ${c}`};$$('input',el).forEach(i=>i.oninput=f);f()},
  kcal(el){el.innerHTML=`<div class="calc"><label>الوزن (كجم)<input type="number" data-a value="70" min="1"></label><label>نوع الجهد<select data-b><option value="1.3">قليل الحركة (1.3)</option><option value="1.4" selected>مجهود متوسط (1.4)</option><option value="1.5">مجهود كبير (1.5)</option></select></label></div><p class="out" data-o></p>`;
    const f=()=>{const kg=num($('[data-a]',el).value),k=num($('[data-b]',el).value);$('[data-o]',el).textContent=kg>0?`${kg} × 24 ساعة × ${k} = ${Math.round(kg*24*k)} سعرة حرارية يومياً تقريباً`:'اكتب الوزن'};$$('input,select',el).forEach(i=>i.oninput=f);f()},
  reff(el){el.innerHTML=`<div class="calc"><label>عدد الكلمات المقروءة<input type="number" data-a value="1000"></label><label>الزمن (دقائق)<input type="number" data-b value="5"></label><label>الإجابات الصحيحة<input type="number" data-c value="9"></label><label>عدد الأسئلة<input type="number" data-d value="10"></label></div><p class="out" data-o></p>`;
    const f=()=>{const w=num($('[data-a]',el).value),t=num($('[data-b]',el).value),c=num($('[data-c]',el).value),q=num($('[data-d]',el).value);
      if(!(w>0&&t>0&&q>0&&c>=0&&c<=q))return $('[data-o]',el).textContent='تأكد من الأرقام (الصحيحة ما تزيد عن عدد الأسئلة)';
      const s=w/t,u=c/q;$('[data-o]',el).innerHTML=`السرعة = ${w} ÷ ${t} = ${Math.round(s)} كلمة/دقيقة<br>نسبة الفهم = ${c} ÷ ${q} × 100 = ${Math.round(u*100)}٪<br>الكفاءة = ${Math.round(s)} × ${Math.round(u*100)}٪ = ${Math.round(s*u)}`};$$('input',el).forEach(i=>i.oninput=f);f()},
  kpi(el){el.innerHTML=`<div class="calc"><label>الهدف<input type="number" data-a value="1000"></label><label>الفعلي<input type="number" data-b value="950"></label></div><p class="out" data-o></p>`;
    const f=()=>{const g=num($('[data-a]',el).value),a=num($('[data-b]',el).value);if(!(g>0))return $('[data-o]',el).textContent='اكتب الهدف';const p=a/g*100;
      $('[data-o]',el).innerHTML=`نسبة التحقق = ${a} ÷ ${g} × 100 = ${p.toFixed(1)}٪ ← <span style="color:var(${p>=100?'--ok':'--bad'})">${p>=100?'أخضر: حقق الهدف':'أحمر: دون الهدف'}</span>`};$$('input',el).forEach(i=>i.oninput=f);f()}
};
window.__GEN={COURSES,norm,shuffle,buildPractice};
route();
})();
