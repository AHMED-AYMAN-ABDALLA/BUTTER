<style>
:root{
  --font:'Readex Pro','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --c1:#4F46E5;--c2:#3B6FE8;--c3:#22A6C9;--grad:linear-gradient(120deg,var(--c1) 0%,var(--c2) 100%);--r:18px;
}
:root[data-theme="light"]{--bg:#F5F6FF;--surface:#FFFFFF;--surface2:#F2F3FE;--ink:#141842;--muted:#5B6394;--line:#E3E6FA;--rule:#CFD4F3;--accent:#5B46F5;--accent-soft:#ECE9FF;--ok:#0B9A6F;--ok-soft:#DDF7EE;--amber:#B86E00;--amber-soft:#FFF1DA;--bad:#D23C55;--shadow:rgba(40,46,120,.16);--glow1:rgba(106,75,255,.13);--glow2:rgba(24,201,230,.12);--glass:rgba(255,255,255,.72)}
:root[data-theme="warm"]{--c1:#B5552B;--c2:#D9822B;--c3:#E3A54A;--bg:#FBF6EE;--surface:#FFFDF8;--surface2:#F6EEE1;--ink:#2A2118;--muted:#76675A;--line:#EADFCF;--rule:#DCCDB7;--accent:#B5552B;--accent-soft:#F7E4D8;--ok:#3E7D4F;--ok-soft:#E1F0E2;--amber:#9A5B12;--amber-soft:#FAEEDC;--bad:#B4363F;--shadow:rgba(90,60,30,.16);--glow1:rgba(181,85,43,.12);--glow2:rgba(227,165,74,.12);--glass:rgba(255,253,248,.75)}
:root[data-theme="dark"]{--bg:#0C1133;--surface:#151C4F;--surface2:#1A225C;--ink:#ECEEFF;--muted:#A3AADB;--line:#262E6B;--rule:#363F8C;--accent:#8B7BFF;--accent-soft:rgba(139,123,255,.16);--ok:#43E8B0;--ok-soft:rgba(67,232,176,.13);--amber:#F6C26B;--amber-soft:rgba(246,194,107,.13);--bad:#FF7A8F;--shadow:rgba(0,0,0,.45);--glow1:rgba(106,75,255,.22);--glow2:rgba(24,201,230,.14);--glass:rgba(12,17,51,.72)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 90% -10%,var(--glow1),transparent 60%),radial-gradient(760px 460px at -10% 35%,var(--glow2),transparent 60%)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font);margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:1.1em;height:1.1em;flex:none;vertical-align:-.17em}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 90px max(16px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);background:var(--glass);border-bottom:1px solid var(--line)}
.top .in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-family:var(--font);padding:6px 10px;border-radius:12px}
.back:hover{background:var(--surface2)}
.mode{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.mode .moon{display:none}:root[data-theme="dark"] .mode .sun{display:none}:root[data-theme="dark"] .mode .moon{display:inline}
.mode svg{width:16px;height:16px}
.hero{padding:44px 0 18px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hero h1{font-size:clamp(30px,5.4vw,52px);margin:14px 0 8px}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--muted);max-width:640px;margin:0 auto;font-size:17px}
.tabs{display:flex;gap:10px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:12px;min-width:min(100%,290px);text-align:start;padding:14px 18px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.tab:hover{transform:translateY(-2px);box-shadow:0 10px 26px -18px var(--shadow)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:0 12px 30px -18px var(--shadow),inset 0 0 0 1px var(--accent)}
.tab .tic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.tab[aria-selected="true"] .tic{background:var(--grad);color:#fff}
.tab .tic svg{width:24px;height:24px}
.tab b{display:block;font-family:var(--font);font-size:16px}
.tab small{color:var(--muted);font-size:13px}
.tab em{font-style:normal;margin-inline-start:auto;font-family:var(--font);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 16px}

  function grab(f) { const o = {}; f.querySelectorAll('[name]').forEach(x => { o[x.name] = x.type === 'checkbox' ? x.checked : x.value; }); return o; }

  async function save(kind, rec) {

    if (e.key === 'Escape' && $('#ovl').innerHTML) closeModal();
    const c = e.target.closest && e.target.closest('[data-open]'); if (c && (e.key === 'Enter' || e.key === ' ') && e.target === c) { e.preventDefault(); details(c.dataset.open); }
    if (e.target.matches && e.target.matches('[role=tab]') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const k = S.tab === 'gp1' ? 'gp2' : 'gp1'; setTab(k); $('#t-' + k).focus(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'q1' || e.target.id === 'q2') { const k = e.target.id, pos = e.target.selectionStart; S[k] = e.target.value; paint(); const n = $('#' + k); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
  });
  document.addEventListener('submit', async e => {
    const f = e.target; if (f.id !== 'pf') return; e.preventDefault(); if (S.busy) return;
    const kind = f.dataset.kind, o = grab(f); S.draft = o;
    let rec; try { rec = check(kind, o); } catch (msg) { return form(kind, String(msg)); }
    S.busy = true; form(kind);
    const wasMine = !!(kind === 'gp1' ? S.mine1 : S.mine2);
    const r = await save(kind, rec); S.busy = false;
    if (r !== 'ok') return form(kind, r === 'denied' ? 'عدّلته قبل شوي، انتظر نص دقيقة وجرّب مرة ثانية. وإذا تكرر، يمكن حسابك موقوف من النشر.' : 'ما قدرنا ننشر الحين. تأكد من الإنترنت وجرّب مرة ثانية.');
    S.draft = null; await load();
    okBox(kind === 'gp1' ? (wasMine ? 'انحفظ التعديل' : 'انتشر استبيانك') : (wasMine ? 'انحفظ التعديل' : 'انعرض مشروعك'),
      kind === 'gp1' ? 'استبيانك صار ظاهر لكل اللي يفتحون مشاريع التخرج. شارك رابط الصفحة مع زملائك عشان تزيد المشاركات.' : 'مشروعك صار في معرض مشاريع التخرج، وأي أحد يقدر يشوفه ويجرّب البروتوتايب.');
  });

  /* theme */
  function paintMode() { const dark = document.documentElement.dataset.theme === 'dark'; $('#mode span').textContent = dark ? 'نهاري' : 'ليلي'; $('#mode').setAttribute('aria-label', dark ? 'الوضع النهاري' : 'الوضع الليلي'); }
  $('#mode').addEventListener('click', () => {
    const h = document.documentElement, t = h.dataset.theme === 'dark' ? 'light' : 'dark'; h.dataset.theme = t;
    try { const p = JSON.parse(localStorage.getItem('study-prefs') || '{}') || {}; p.theme = t; localStorage.setItem('study-prefs', JSON.stringify(p)); } catch (e) {}
    paintMode();
  });
  paintMode();
  S.tab = location.hash === '#gp2' ? 'gp2' : 'gp1';
  addEventListener('hashchange', () => { const k = location.hash === '#gp2' ? 'gp2' : 'gp1'; if (k !== S.tab) { S.tab = k; paint(); } });
  paint(); load();
})();
</script>
</body>
