<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Study Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- FILE MAP:  1. STYLES   2. DATA (injected)   3. APP -->

<style>
/* ===================== 1. STYLES (book edition) ===================== */

/* ---------- 1.1 Tokens: Light (cream paper, default) ---------- */
:root{
  --root:17.5px;
  --desk:#DCD2BF; --glow:rgba(255,255,255,.4);
  --bg:#FBF7EE;  --surface:#FFFCF5;  --ink:#271E15;  --ink-2:#3A2F24;  --muted:#6B5D4B;
  --line:#E6DCC8; --rule:#CDBFA6;
  --accent:#8B2E24; --accent-ink:#6A2018; --accent-soft:#F3E4D8;
  --ok:#47724A;  --ok-soft:#E5EEDC;  --bad:#A3402C;  --bad-soft:#F6E0D6;
  --on-accent:#FFF8EE; --key:#22344F;
  --shadow:rgba(70,45,15,.30); --gutter:rgba(90,60,20,.11);
  --font:'Inter','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;
}
/* ---------- 1.2 Tokens: Warm (old sepia paper) ---------- */
html[data-theme="warm"]{
  --desk:#C9B794; --glow:rgba(255,245,220,.35);
  --bg:#F1E4C8;  --surface:#F7ECD5;  --ink:#2B1F12;  --ink-2:#3A2C1B;  --muted:#66512F;
  --line:#DFCDA8; --rule:#C2AA7E;
  --accent:#7A3B1A; --accent-ink:#5A2A10; --accent-soft:#EAD6B4;
  --ok:#4F6A2C;  --ok-soft:#E2E2C0;  --bad:#953A22;  --bad-soft:#EED3BD;
  --on-accent:#FBF1DE; --key:#5A2A10;
  --shadow:rgba(80,50,10,.35); --gutter:rgba(90,55,10,.14);
}
/* ---------- 1.3 Tokens: Dark (reading at night) ---------- */
html[data-theme="dark"]{
  --desk:#121110; --glow:rgba(255,255,255,.03);
  --bg:#1F1C18;  --surface:#27231E;  --ink:#EEE6D6;  --ink-2:#DCD2C0;  --muted:#A99C88;
  --line:#37312A; --rule:#4C443A;
  --accent:#D9A066; --accent-ink:#ECC392; --accent-soft:#3A2D1F;
  --ok:#93BC8C;  --ok-soft:#22301F;  --bad:#E3927F;  --bad-soft:#3B2420;
  --on-accent:#1F1C18; --key:#F0C98F;
  --shadow:rgba(0,0,0,.65); --gutter:rgba(0,0,0,.35);
}
/* ---------- 1.4 Text size ---------- */
html[data-size="s"]{--root:16px}
html[data-size="m"]{--root:17.5px}
html[data-size="l"]{--root:19.5px}

/* ---------- 1.5 Base: the desk and the page ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--root);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);font-size:1rem;line-height:1.78;min-height:100vh;overflow-wrap:break-word;
  background-color:var(--desk);
  background-image:radial-gradient(ellipse at 50% -10%,var(--glow),transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.14),transparent 55%);
  background-attachment:fixed;transition:background-color .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
[hidden]{display:none!important}
strong{font-weight:700;color:var(--key)}
.ar{direction:rtl;text-align:right;font-family:var(--font-ar);font-size:1.1em;line-height:2}

/* the page itself, with a spine shadow and a stack of pages beneath */
.wrap{position:relative;width:calc(100% - 2rem);max-width:46rem;margin:2.2rem auto 3.5rem;padding:0 3.2rem 3rem;
  min-height:calc(100vh - 5.7rem);
  background-color:var(--bg);
  background-image:linear-gradient(to right,var(--gutter),transparent 2.6rem);
  border-radius:3px 6px 6px 3px;
  box-shadow:0 0 0 1px var(--line),
    3px 3px 0 -1px var(--bg),3px 3px 0 0 var(--rule),
    6px 6px 0 -1px var(--bg),6px 6px 0 0 var(--rule),
    0 26px 50px -18px var(--shadow);
  transition:background-color .3s}
/* ribbon bookmark */
.wrap::before{content:"";position:absolute;top:-5px;right:1rem;width:1.05rem;height:4.4rem;z-index:7;
  background:linear-gradient(to right,rgba(0,0,0,.12),transparent 40%,rgba(255,255,255,.12)),var(--accent);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);pointer-events:none}

/* ---------- 1.6 Motion: page turn (off if the device asks for less) ---------- */
@keyframes turn{from{opacity:0;transform:perspective(1800px) rotateY(-10deg) translateX(18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#app{transform-origin:left center}
#app.enter{animation:turn .55s cubic-bezier(.2,.7,.2,1) both}
.swap{animation:fade .3s ease both}
.fbin{animation:rise .3s ease both}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

/* ---------- 1.7 Running header and buttons ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin:0 -3.2rem 1.8rem;padding:.75rem 3.2rem .65rem;
  font-size:.92rem;color:var(--muted);position:sticky;top:0;z-index:6;
  background:linear-gradient(to right,var(--gutter),transparent 2.6rem),var(--bg);
  border-bottom:1px solid var(--line);border-radius:3px 6px 0 0;font-variant:small-caps;letter-spacing:.04em;transition:background-color .3s}
.crumb{font-weight:600;color:var(--muted)}
.text{color:var(--muted);padding:.25rem .15rem;transition:color .15s}
.text:hover:not([disabled]){color:var(--accent)}
.text[disabled]{opacity:.4;cursor:default}
.menuwrap{position:relative}
.gear{width:2.3rem;height:2.3rem;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;background:var(--surface);color:var(--muted);transition:border-color .15s,color .15s}
.gear svg{width:1.1rem;height:1.1rem;transition:transform .3s}
.gear:hover,.gear[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.gear[aria-expanded="true"] svg{transform:rotate(45deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem 1.4rem;border-radius:3px;border:1px solid var(--rule);background:var(--surface);font-weight:600;transition:border-color .15s,background .15s,transform .1s}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.sm{padding:.35rem 1rem;font-size:.92rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover:not([disabled]){background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row-btns{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.6rem;align-items:center}

/* ---------- 1.8 Reading settings panel ---------- */
.menu{position:absolute;right:0;top:calc(100% + .6rem);z-index:5;width:min(20rem,calc(100vw - 2rem));padding:1rem 1.1rem;border-radius:4px;
  background:var(--surface);border:1px solid var(--rule);box-shadow:0 16px 34px -12px var(--shadow);animation:rise .22s ease both;
  font-variant:normal;letter-spacing:0}
.menu h4{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:.7rem}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.35rem 0;font-size:.92rem;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden}
.seg button{padding:.15rem .85rem;font-size:.86rem;color:var(--muted);transition:background .15s,color .15s}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.seg button:hover:not(.on){color:var(--ink)}

/* ---------- 1.9 Title pages and table of contents ---------- */
.kick{text-align:center;font-size:.78rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:1.4rem 0 .5rem}
h1{font-size:clamp(1.75rem,5vw,2.5rem);font-weight:600;line-height:1.2;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
h1::after{content:"\2766";display:block;font-size:1.2rem;font-weight:400;color:var(--accent);margin-top:.6rem}
.lead{color:var(--muted);margin:.7rem auto 2rem;text-align:center;font-style:italic;max-width:31rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:1.6rem;border-top:3px double var(--rule);border-bottom:3px double var(--rule)}
.stat{padding:.85rem .8rem;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:1.55rem;font-weight:600;line-height:1.25;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);line-height:1.35;display:block;font-style:italic}
.stat .tr{height:3px;border-radius:99px;background:var(--line);margin:.5rem auto 0;max-width:6rem;overflow:hidden}
.stat .tr i{display:block;height:100%;background:var(--ok);transition:width .4s ease}
.resume{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;padding:.9rem 1.2rem;margin-bottom:1.8rem;border-radius:0 3px 3px 0;
  background:var(--accent-soft);border-left:4px solid var(--accent);color:var(--accent-ink);font-weight:600;transition:transform .15s}
.resume:hover{transform:translateX(3px)}
.resume small{display:block;font-weight:400;font-style:italic;color:var(--ink-2);font-size:.86rem}
.sec{display:flex;align-items:center;gap:.9rem;font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:2.3rem 0 .5rem}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.slides{list-style:none;display:grid}
.slides button{width:100%;display:grid;grid-template-columns:2rem minmax(0,1fr) auto 1rem;gap:.9rem;align-items:baseline;text-align:left;padding:.7rem .5rem;
  border-bottom:1px dotted var(--rule);transition:background .15s}
.slides button:hover{background:var(--accent-soft)}
.slides .n{font-weight:700;font-size:1.05rem;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.slides .done .n{color:var(--ok)}
.slides .t{display:block;font-weight:600;font-size:1.05rem;line-height:1.35}
.slides .m{display:block;font-size:.82rem;color:var(--muted);font-style:italic;line-height:1.4}
.slides .s{font-size:.85rem;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.slides .done .s{color:var(--ok);font-weight:700}
.slides .go{color:var(--muted)}
.secrow{list-style:none;margin:1.5rem 0 .1rem;font-size:.98rem;font-style:italic;font-weight:600;color:var(--accent-ink);padding-left:.5rem}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.6rem}
.tcard{text-align:left;padding:1rem 1.15rem;border-radius:3px;background:var(--surface);border:1px solid var(--rule);transition:border-color .15s,background .15s}
.tcard:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.tcard b{display:block;font-weight:700;font-size:1.06rem}
.tcard span{display:block;font-size:.88rem;color:var(--muted);line-height:1.5;margin-top:.15rem;font-style:italic}
.tcard.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tcard.pri span{color:inherit;opacity:.88}
.tcard.pri:hover:not([disabled]){background:var(--accent-ink);border-color:var(--accent-ink)}
.tcard[disabled]{opacity:.5;cursor:not-allowed}
.foot-note{margin-top:2rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}

/* ---------- 1.10 Reading page ---------- */
h2{font-size:clamp(1.5rem,4.2vw,1.95rem);font-weight:600;line-height:1.25;margin:.3rem 0 .5rem;text-wrap:balance}
.pos{display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.86rem;font-style:italic;margin-bottom:1.9rem}
.pos .tr{flex:1;height:2px;background:var(--line);overflow:hidden}
.pos .tr i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.item{margin-bottom:1.6rem;scroll-margin-top:5rem}
.item h3{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.item p.en{font-size:1.06rem;text-align:justify;hyphens:auto}
.item:first-of-type>p.en::first-letter{float:left;font-size:3.3em;line-height:.82;margin:.08em .1em 0 0;font-weight:600;color:var(--accent)}
.item p.ar{position:relative;color:var(--ink-2);margin-top:.9rem;padding-top:.85rem;font-size:1.18rem;line-height:2}
.item p.ar::before{content:"";position:absolute;top:0;right:0;width:3.5rem;height:1px;background:var(--rule)}
.item.hot{padding:.9rem 1.25rem 1rem;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 3px 3px 0}
.item.hot::before{content:"\2726  Key idea";display:block;font-size:.66rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.35rem;white-space:pre}
.item.new{animation:rise .45s ease both}
.cont{margin:.6rem 0;display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.take{margin:2.3rem 0 .5rem;padding:1.1rem 1.3rem;border-top:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);text-align:center;font-style:italic;font-size:1.08rem}
.take h3{font-size:.72rem;font-weight:700;font-style:normal;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.take .ar{color:var(--ink-2);margin-top:.35rem;text-align:center;font-style:normal}

.arb{font-family:var(--font-ar);font-size:1.08em;direction:rtl;unicode-bidi:isolate}
.cont .text{font-size:1rem}

/* ---------- 1.11 Interactive explorer (a framed figure box) ---------- */
.explore{margin:2.4rem 0 .5rem;padding:1.4rem 1.5rem;border-radius:2px;background:var(--surface);border:1px solid var(--rule);
  box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--line);scroll-margin-top:5rem}
.explore h3{font-size:1.15rem;font-weight:600}
.explore h3::before{content:"Explore";display:block;font-size:.68rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.explore .sub{color:var(--muted);font-size:.9rem;font-style:italic;margin:.1rem 0 .9rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .9rem;border-radius:99px;border:1px solid var(--rule);background:var(--bg);font-weight:600;font-size:.92rem;transition:background .2s,border-color .2s,color .2s}
.pill b{width:1.25rem;height:1.25rem;border-radius:50%;background:var(--line);color:var(--ink-2);display:grid;place-items:center;font-size:.72rem;font-weight:700;transition:background .2s,color .2s}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.pill.on b{background:var(--accent);color:var(--on-accent)}
.pill.past b{background:var(--accent-soft);color:var(--accent-ink)}
.sep{color:var(--muted);font-size:.9rem}
.detail{margin-top:1rem;padding:1rem 1.15rem;border-radius:0 3px 3px 0;background:var(--bg);border-left:2px solid var(--rule);min-height:5.5rem}
.detail .ar{color:var(--ink-2);margin-top:.8rem;font-size:1.16rem}
.dg{margin-top:.9rem}
.exnav{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem}
.exnav:empty{display:none}
.foot{margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line);color:var(--ink-2);font-size:.95rem;font-style:italic}
.foot .ar{margin-top:.25rem;font-style:normal}
.foot:empty{display:none}

/* diagram atoms used inside explorer details */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}
.nd{display:inline-flex;flex-direction:column;align-items:center;text-align:center;padding:.35rem .7rem;border-radius:4px;background:var(--surface);border:1px solid var(--rule);font-weight:600;font-size:.86rem;line-height:1.35;min-width:3.2rem}
.nd small{font-weight:400;color:var(--muted);font-size:.8rem;font-family:var(--font-ar);direction:rtl}
.nd.y{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.nd.k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nd.k small{color:inherit;opacity:.85}
.nd.r{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.nd.g{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.arr{display:inline-flex;flex-direction:column;align-items:center;color:var(--muted)}
.arr svg{width:1.7rem;height:.62rem}
.arr i{font-size:.7rem;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:.4rem}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tags span{border:1px solid var(--rule);border-radius:99px;padding:0 .65rem;font-size:.8rem;color:var(--muted);font-style:italic}
.keys{display:flex;gap:.4rem;flex-wrap:wrap}
.kc{padding:.05rem .55rem;border-radius:3px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.8rem}
.kc.o{background:transparent;color:var(--muted);border:1px dashed var(--muted)}

/* ---------- 1.12 Exercises ---------- */
.check{margin-top:2.6rem;padding-top:.4rem;scroll-margin-top:3rem}
.check::before{content:"\2726 \2726 \2726";display:block;text-align:center;color:var(--accent);letter-spacing:.7em;font-size:.75rem;margin-bottom:1.6rem}
.check h3{font-size:1.3rem;font-weight:600;margin-bottom:.1rem}
.check .sub{color:var(--muted);font-size:.92rem;font-style:italic;margin-bottom:1.2rem}
.qmeta{display:flex;justify-content:space-between;gap:.6rem;color:var(--muted);font-size:.88rem;font-style:italic;margin-bottom:.5rem}
.track{height:2px;background:var(--line);margin:0 0 1.5rem;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.qtext{font-size:1.22rem;font-weight:600;line-height:1.5;margin-bottom:1.3rem}
.opts{display:grid;gap:.6rem}
.opt{display:grid;grid-template-columns:1.8rem 1fr;gap:.8rem;align-items:center;text-align:left;padding:.75rem 1rem;border-radius:3px;background:var(--surface);border:1px solid var(--rule);line-height:1.5;transition:border-color .2s,background .2s,opacity .25s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{width:1.75rem;height:1.75rem;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:.85rem}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .l{color:var(--ok);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .l{color:var(--bad);border-color:var(--bad)}
.opt.dim{opacity:.5}
.verdict{margin-top:1.3rem;font-weight:700;font-size:1.05rem}
.verdict.good{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.ans{margin-top:.2rem;color:var(--ink-2);font-size:.97rem;font-style:italic}
.why{margin-top:.9rem;padding:.85rem 1rem;border-radius:0 3px 3px 0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--rule)}
.why + .why{margin-top:.6rem}
.why h4{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.1rem}
.why .ar{font-size:1.16rem}

/* ---------- 1.13 Results ---------- */
.score{font-size:3.6rem;font-weight:600;line-height:1.1;margin-top:.4rem;font-variant-numeric:lining-nums}
.score small{font-size:1.3rem;color:var(--muted);font-weight:400}
.msg{color:var(--muted);margin-top:.2rem;font-style:italic}
.missed{margin-top:2.1rem}
.missed h3,.bk h3{font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem}
.mi{padding:1rem 0;border-top:1px dotted var(--rule)}
.mi .q{font-weight:600}
.mi .a{color:var(--ink-2);font-size:.95rem;margin-top:.1rem;font-style:italic}
.mi .ar{margin-top:.5rem;font-size:1.14rem;color:var(--ink-2)}
.bk{margin-top:1.7rem}
.bk .r{display:grid;grid-template-columns:1.8rem 1fr auto;gap:.6rem;padding:.5rem 0;border-top:1px dotted var(--rule);font-size:.95rem}
.bk .r span:first-child,.bk .r span:last-child{color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.bk .r span.low{color:var(--bad)}

    {
     "h": null,
     "en": "The figure shows how the SSL protocol works to secure communication between applications.",
     "ar": "يوضح الشكل طريقة عمل بروتوكول إس إس إل لتأمين الاتصال بين التطبيقات",
     "hot": false
    },
    {
     "h": "Handshake and Change Cipher Spec",
     "en": "At the start there are the **Handshake Protocol**, responsible for establishing a secure connection between the two parties and agreeing on the encryption keys. After that comes the **Change Cipher Spec Protocol**, used to announce the switch to using the agreed encryption settings.",
     "ar": "في البداية توجد بروتوكولات **المصافحة هاند شيك بروتوكول** وهي المسؤولة عن إنشاء اتصال آمن بين الطرفين والاتفاق على مفاتيح التشفير، بعد ذلك يأتي **تشينج سايفر سبيك بروتوكول** ويستخدم للإعلان عن الانتقال إلى استخدام إعدادات التشفير المتفق عليها",
     "hot": false
    },
    {
     "h": "Alert, HTTP and Heartbeat",
     "en": "The **Alert Protocol** is responsible for sending warning messages, errors and notifications related to the secure connection. There is the **HTTP** protocol, used to transfer Web page data. And there is the **Heartbeat Protocol**, which was used to check that the connection between the two parties continues.",
     "ar": "أما **أليرت بروتوكول** فهو المسؤول عن إرسال رسائل التنبيه والأخطاء والإشعارات المتعلقة بالاتصال الآمن، ويوجد **بروتوكول إتش تي تي بي** الذي يستخدم لنقل بيانات صفحات الويب، وهناك **هارت بيت بروتوكول** الذي كان يستخدم للتحقق من استمرار الاتصال بين الطرفين",
     "hot": false
    },
    {
     "h": "Record Protocol, TCP and IP",
     "en": "All these protocols in the upper layer rely on the **Record Protocol**, which divides, organizes and prepares the data for sending while providing suitable protection. After that the data moves to **TCP**, responsible for transferring data between the two parties reliably. Finally comes the **IP** layer, responsible for routing the data to the correct address across the network.",
     "ar": "كل هذه البروتوكولات الموجودة في الطبقة العليا تعتمد على **ريكورد بروتوكول** الذي يقوم بتقسيم البيانات وتنظيمها وتجهيزها للإرسال مع توفير الحماية المناسبة، بعد ذلك تنتقل البيانات إلى **تي سي بي** المسؤول عن نقل البيانات بين الطرفين بشكل موثوق، وفي النهاية تأتي طبقة **آي بي** المسؤولة عن توجيه البيانات إلى العنوان الصحيح عبر الشبكة",
     "hot": false
    },
    {
     "h": "The main idea",
     "en": "The main idea is that the protocols at the top use the Record Protocol, then the data moves through TCP and after it IP until it reaches the other party.",
     "ar": "الفكرة الأساسية هي أن البروتوكولات الموجودة في الأعلى تستخدم ريكورد بروتوكول ثم تنتقل البيانات عبر تي سي بي وبعدها آي بي حتى تصل إلى الطرف الآخر",
     "hot": true
    }
   ],

     "h": "Fragment and compress",
     "en": "At the start we have the data we want to send. Then the data is divided into small parts to make it easier to handle, then the data can be compressed to reduce its size.",
     "ar": "في البداية تكون لدينا البيانات التي نريد إرسالها بعدها يتم تقسيم البيانات إلى أجزاء صغيرة لتسهيل التعامل معها ثم يمكن ضغط البيانات لتقليل حجمها",
     "hot": false
    },
    {
     "h": "Add MAC and encrypt",
     "en": "After that a code is added that helps make sure the data has not been tampered with, then the data is encrypted so others cannot read it.",
     "ar": "بعد ذلك تتم إضافة رمز يساعد على التأكد من أن البيانات لم يتم التلاعب بها ثم يتم تشفير البيانات حتى لا يستطيع الآخرون قراءتها",
     "hot": false
    },
    {
     "h": "Append header",
     "en": "Finally a header is added that contains information about the data such as its type, its size and the protocol version.",
     "ar": "وفي النهاية تتم إضافة ترويسة تحتوي على معلومات عن البيانات مثل نوعها وحجمها وإصدار البروتوكول",
     "hot": false
    },
    {
     "h": "Record format",
     "en": "It shows the form of the data after it is prepared. At the start there is information showing the data type, the protocol version and the data size. Then comes the data itself, which may be compressed. At the end there is the data integrity code. The figure shows that **the data and the integrity code are encrypted together**.",
     "ar": "توضح شكل البيانات بعد تجهيزها في البداية توجد معلومات توضح نوع البيانات وإصدار البروتوكول وحجم البيانات ثم تأتي البيانات نفسها وقد تكون مضغوطة وفي النهاية يوجد رمز التحقق من سلامة البيانات وتوضح الصورة **أن البيانات ورمز التحقق يكونان مشفرين معًا**",
     "hot": true
    }

     "h": null,
     "en": "The first figure: the secure connection records protocol. Its idea is to organize data before sending it over a secure connection between two devices.",
     "ar": "الصورة الأولى بروتوكول سجلات الاتصال الآمن فكرته تنظيم البيانات قبل إرسالها عبر اتصال آمن بين جهازين",
     "hot": false
    },
    {
     "h": "Change Cipher Spec",
     "en": "Change Cipher Spec means switching to using the encryption settings agreed between the two parties.",
     "ar": "تغيير مواصفات التشفير يعني الانتقال إلى استخدام إعدادات التشفير المتفق عليها بين الطرفين",
     "hot": false
    },
    {
     "h": "Alert Protocol",
     "en": "The Alert Protocol is used to send an alert when a problem occurs in the connection or when the connection is closed securely. **The alert level shows the degree of the alert. The alert type shows the reason for the alert.**",
     "ar": "بروتوكول التنبيهات يستخدم لإرسال تنبيه عند حدوث مشكلة في الاتصال أو عند إغلاق الاتصال بشكل آمن. **مستوى التنبيه يوضح درجة التنبيه. نوع التنبيه يوضح سبب التنبيه**",
     "hot": false
    },
    {
     "h": "Handshake Protocol",
     "en": "The Handshake Protocol is used at the start of the connection so the two parties agree on the encryption method and the server verifies the other party's identity when needed. **The message type sets the kind of information sent. The message length sets the size of the data. The content is the data inside the message.**",
     "ar": "بروتوكول المصافحة يستخدم في بداية الاتصال حتى يتفق الطرفان على طريقة التشفير ويتحقق الخادم من هوية الطرف الآخر عند الحاجة. **نوع الرسالة يحدد نوع المعلومات المرسلة. طول الرسالة يحدد حجم البيانات. المحتوى هو البيانات الموجودة داخل الرسالة**",
     "hot": true
    },
    {
     "h": "Other application protocols",
     "en": "Other application protocols are the data that applications send, such as website pages. The secure connection protocol protects this data while it moves across the network.",
     "ar": "بروتوكولات التطبيقات الأخرى هي البيانات التي ترسلها التطبيقات مثل صفحات المواقع. يقوم بروتوكول الاتصال الآمن بحماية هذه البيانات أثناء انتقالها عبر الشبكة",
     "hot": false
    }
   ],

    {

     "h": "hello_request, client_hello, server_hello",
     "en": "**hello_request** (null): empty, nothing in it, just a signal for the client to start again. **client_hello** (version, random, session id, cipher suite, compression method): the client sends the protocol version it knows, a random number, the session number, the encryption methods it supports and the compression methods it supports. **server_hello** (same parameters): the server replies with the same things but **picks one of each**: one version, one encryption method, one compression method, and sends its random number and the session number.",
     "ar": "**hello_request** (null): فاضية، ما فيها شي، بس تنبيه للعميل يبدأ من جديد. **client_hello** (version, random, session id, cipher suite, compression method): العميل يرسل: نسخة البروتوكول اللي يعرفها، ورقم عشوائي، ورقم الجلسة، وطرق التشفير اللي يدعمها، وطرق الضغط اللي يدعمها. **server_hello** (نفس المعاملات): السيرفر يرد بنفس الأشياء، **بس يختار منها واحد واحد**: نسخة وحدة، وطريقة تشفير وحدة، وطريقة ضغط وحدة، ويرسل رقمه العشوائي ورقم الجلسة",
     "hot": false
    },
    {
     "h": "certificate and server_key_exchange",
     "en": "**certificate** (chain of X.509v3 certificates): a chain of digital certificates, meaning the server's ID card along with the cards of the authorities that vouch for it. **server_key_exchange** (parameters, signature): values both parties need to make the secret key, with a signature proving they come from the server.",
     "ar": "**certificate** (chain of X.509v3 certificates): سلسلة شهادات رقمية، يعني بطاقة هوية السيرفر ومعها بطاقات الجهات اللي تضمنه. **server_key_exchange** (parameters, signature): قيم يحتاجها الطرفين لصنع المفتاح السري، ومعها توقيع يثبت إنها من السيرفر",
     "hot": false
    },
    {
     "h": "certificate_request and server_done",
     "en": "**certificate_request** (type, authorities): the server sets the type of certificate it wants from the client and the authorities it trusts. **server_done** (null): empty, nothing in it, it just means the server is finished.",
     "ar": "**certificate_request** (type, authorities): السيرفر يحدد نوع الشهادة اللي يبيها من العميل، والجهات اللي يثق فيها. **server_done** (null): فاضية، ما فيها شي، بس تعني السيرفر خلص",
     "hot": false
    },
    {
     "h": "certificate_verify and client_key_exchange",
     "en": "**certificate_verify** (signature): a signature from the client proving the certificate it sent is its own. **client_key_exchange** (parameters, signature): the client sends its values that the secret key is formed from, with a signature.",
     "ar": "**certificate_verify** (signature): توقيع من العميل يثبت إن الشهادة اللي أرسلها حقته. **client_key_exchange** (parameters, signature): العميل يرسل قيمه اللي يتكون منها المفتاح السري، ومعها توقيع",

    },

     "h": "Phase 4",
     "en": "Change cipher suite and finish handshake protocol.",

   "title": "Cryptographic Computations",
   "items": [
    {
     "h": "1. Creating a Shared Master Secret",
     "en": "The client and server create a shared master secret using a secure key exchange. This secret is used to generate the cryptographic keys needed for the current session. **Simple idea:** the client and server share a secret to help secure their communication.",
     "ar": "أولًا إنشاء السر الرئيسي المشترك: يتم إنشاء سر رئيسي مشترك بين العميل والخادم عن طريق تبادل المفاتيح بشكل آمن، هذا السر يستخدم في تجهيز مفاتيح التشفير الخاصة بالجلسة الحالية. **الفكرة ببساطة** العميل والخادم يتفقون على سر مشترك يستخدمونه لتأمين الاتصال بينهم",
     "hot": false
    },
    {
     "h": "2. Generating Cryptographic Parameters",
     "en": "The master secret is used to generate **six values** needed for encryption and data protection. **Client Write MAC Secret:** checks the integrity of messages sent by the client. **Server Write MAC Secret:** checks the integrity of messages sent by the server.",
     "ar": "ثانيًا إنشاء معلمات التشفير: يُستخدم السر الرئيسي لإنشاء **ست قيم** ضرورية للتشفير وحماية البيانات. **سر التحقق من رسائل العميل** يُستخدم للتأكد من سلامة الرسائل التي يرسلها العميل وعدم التلاعب بها. **سر التحقق من رسائل الخادم** يُستخدم للتأكد من سلامة الرسائل التي يرسلها الخادم وعدم التلاعب بها",
     "hot": false
    },
    {
     "h": "Keys and IVs",
     "en": "**Client Write Key:** encrypts data sent by the client. **Server Write Key:** encrypts data sent by the server. **Client Write IV:** helps initialize the encryption process for the client. **Server Write IV:** helps initialize the encryption process for the server.",
     "ar": "**مفتاح تشفير العميل** يُستخدم لتشفير البيانات التي يرسلها العميل. **مفتاح تشفير الخادم** يُستخدم لتشفير البيانات التي يرسلها الخادم. **قيمة التهيئة الخاصة بالعميل** تُستخدم لبدء عملية التشفير لدى العميل. **قيمة التهيئة الخاصة بالخادم** تُستخدم لبدء عملية التشفير لدى الخادم",
     "hot": false
    },
    {
     "h": "How they are generated",
     "en": "These values are generated by applying **hash functions** to produce enough secure bytes for all the required parameters.",
     "ar": "تُنشأ هذه القيم باستخدام **دوال رياضية خاصة** تنتج عددًا كافيًا من البايتات الآمنة لتوفير جميع القيم المطلوبة",
     "hot": false
    },
    {
     "h": "Easy Way to Remember",
     "en": "**Master Secret:** the main secret used to generate other values. **Encryption Keys:** protect data by encrypting it. **MAC Secrets:** help detect message modification. **IVs:** help initialize certain encryption methods. **Summary:** create a shared master secret, then use it to generate the values needed to encrypt and protect data in both directions.",
     "ar": "**السر الرئيسي** هو السر الأساسي الذي تُشتق منه بقية القيم. **مفاتيح التشفير** تحمي البيانات عن طريق تشفيرها. **أسرار التحقق** تساعد على اكتشاف أي تعديل على الرسائل. **قيم التهيئة** تساعد على بدء بعض طرق التشفير. **الخلاصة** يتم إنشاء سر رئيسي مشترك ثم يُستخدم لاشتقاق القيم اللازمة لتشفير البيانات وحمايتها أثناء إرسالها في كلا الاتجاهين",

    {
     "h": "Its job",
     "en": "Its job is to take a small secret and produce from it a large amount of random data that we use as encryption keys. It is like a machine that takes one seed and grows a whole farm from it.",
     "ar": "وظيفتها إنها تاخذ سر صغير وتطلع منه كمية كبيرة من البيانات العشوائية نستخدمها كمفاتيح تشفير يعني مثل آلة تاخذ بذرة وحدة وتزرع منها مزرعة كاملة",
     "hot": false
    },
    {
     "h": "Two inputs",
     "en": "We have two inputs. The first is the **secret**, the main key the two parties agreed on. The second is the **seed**, known data like the random numbers they exchanged during the handshake.",
     "ar": "عندنا مدخلين الأول **السر** وهو المفتاح الأساسي اللي اتفق عليه الطرفين والثاني **البذرة** وهي بيانات معروفة زي الأرقام العشوائية اللي تبادلوها وقت المصافحة",
     "hot": false
    },

   "items": [
    {
     "h": null,
     "en": "This figure shows the layers of the SSH protocol. They are layers on top of each other, and each layer relies on the one below it.",
     "ar": "هذي الصورة توضح طبقات بروتوكول الصدفة الآمنة وهي طبقات فوق بعض وكل طبقة تعتمد على اللي تحتها",
     "hot": false
    },
    {
     "h": "IP and TCP",
     "en": "At the bottom is the **Internet protocol**, responsible for delivering data packets across networks from one device to another without guaranteeing they arrive complete or in order. Above it is the **Transmission control protocol**, which makes delivery reliable because it opens a connection between the two parties and makes sure the data arrived complete and in the correct order.",
     "ar": "في الأسفل **بروتوكول الإنترنت** وهو المسؤول عن توصيل حزم البيانات عبر الشبكات من جهاز لجهاز ثاني بدون ما يضمن إنها توصل كاملة أو مرتبة، فوقه **بروتوكول التحكم بالنقل** وهو اللي يخلي التوصيل موثوق لأنه يفتح اتصال بين الطرفين ويتأكد إن البيانات وصلت كاملة وبالترتيب الصحيح",
     "hot": false
    },
    {
     "h": "SSH Transport Layer Protocol",
     "en": "Above it is the SSH transport layer, which is **the heart of the protection**, because it proves the server's identity, encrypts the data so no one reads it, and protects it from modification. It may also compress the data if needed.",
     "ar": "فوقه طبقة النقل الخاصة بالصدفة الآمنة وهي **قلب الحماية** لأنها تثبت هوية السيرفر وتشفّر البيانات عشان محد يقراها وتحميها من التعديل وممكن كمان تضغط البيانات إذا احتجنا",
     "hot": false
    },
    {
     "h": "User Authentication and Connection Protocols",
     "en": "At the top there are two protocols side by side. The first is the **user authentication protocol**, which proves to the server who the user logging in is, for example with a password or a key. The second is the **connection protocol**, which takes the single encrypted tunnel and divides it into several channels, so you can do more than one thing at the same time, such as running commands and transferring files over the same secure connection.",
     "ar": "وفي الأعلى فيه بروتوكولين جنب بعض الأول **بروتوكول التحقق من المستخدم** وهو اللي يثبت للسيرفر مين المستخدم اللي داخل مثلًا بكلمة مرور أو مفتاح، والثاني **بروتوكول الاتصال** وهو اللي ياخذ النفق المشفّر الواحد ويقسمه لعدة قنوات عشان تقدر تسوي أكثر من شي بنفس الوقت مثل تنفيذ أوامر ونقل ملفات من خلال نفس الاتصال الآمن",
     "hot": false
    },
    {
     "h": "The bottom line",
     "en": "The bottom line is that **the transport layer builds the secure tunnel and verifies the server's identity**, then **the authentication protocol verifies the user's identity**, and finally **the connection protocol divides the tunnel into channels, one channel for each task**.",
     "ar": "الزبدة إن **طبقة النقل تبني النفق الآمن وتتأكد من هوية السيرفر** وبعدها **بروتوكول التحقق يتأكد من هوية المستخدم** وأخيرًا **بروتوكول الاتصال يقسم النفق لقنوات لكل مهمة قناة**",
     "hot": true
    }
   ],

     "e": "طبقة النقل الخاصة بالصدفة الآمنة هي قلب الحماية لأنها تثبت هوية السيرفر وتشفّر البيانات وتحميها من التعديل."

     "e": "بروتوكول التحقق من المستخدم يثبت للسيرفر مين المستخدم اللي داخل، مثلًا بكلمة مرور أو مفتاح."

   "title": "SSH User Authentication Methods",
   "items": [
    {
     "h": "Public Key Authentication",
     "en": "The client sends its public key to the server with a **signature created using the client's private key**. The server checks whether the key is accepted and verifies the signature before allowing access.",
     "ar": "التحقق بالمفتاح العام: يرسل العميل مفتاحه العام إلى السيرفر مع **توقيع تم إنشاؤه باستخدام المفتاح الخاص للعميل** ويتحقق السيرفر مما إذا كان المفتاح مقبولًا ويتأكد من صحة التوقيع قبل السماح بالدخول",
     "hot": false
    },
    {
     "h": "Password Authentication",
     "en": "The client sends a password to the server. The password is **protected by encryption during transmission**. The server checks the password and allows access if it is correct.",
     "ar": "التحقق بكلمة المرور: يرسل العميل كلمة المرور إلى السيرفر وتكون كلمة المرور **محمية بالتشفير أثناء الإرسال** ويتحقق السيرفر من كلمة المرور ويسمح بالدخول إذا كانت صحيحة",
     "hot": false
    },
    {
     "h": "Host-Based Authentication",
     "en": "**The server verifies the identity of the client's computer instead of verifying the user directly.** The client's computer sends a signature created using its private key, and the server verifies the computer's identity before allowing the connection.",
     "ar": "التحقق المعتمد على الجهاز: **يتحقق السيرفر من هوية جهاز العميل بدلًا من التحقق من المستخدم مباشرة** حيث يرسل جهاز العميل توقيعًا تم إنشاؤه باستخدام مفتاحه الخاص ويتحقق السيرفر من هوية الجهاز قبل السماح بالاتصال",
     "hot": true
    }
   ],

   "items": [
    {
     "h": null,
     "en": "At the start, a secure connection is established between the client and the server using the SSH protocol.",
     "ar": "في البداية يتم إنشاء اتصال آمن بين الكلاينت والسيرفر باستخدام بروتوكول إس إس إتش",
     "hot": false
    },
    {
     "h": "Open a channel",
     "en": "After that the client sends an **SSH_MSG_CHANNEL_OPEN** message to request opening a communication channel, and the server replies with an **SSH_MSG_CHANNEL_OPEN_CONFIRMATION** message to confirm opening the channel.",
     "ar": "بعد ذلك يرسل الكلاينت رسالة **إس إس إتش تشانل أوبن** لطلب فتح قناة اتصال ويرد السيرفر برسالة **إس إس إتش تشانل أوبن كونفرميشن** لتأكيد فتح القناة",
     "hot": false
    },
    {
     "h": "Data transfer",
     "en": "Then data is exchanged between the client and the server using the **SSH_MSG_CHANNEL_DATA** message, where each party can send data to the other party.",
     "ar": "ثم يتم تبادل البيانات بين الكلاينت والسيرفر باستخدام رسالة **إس إس إتش تشانل داتا** حيث يستطيع كل طرف إرسال البيانات للطرف الآخر",
     "hot": false
    },
    {
     "h": "Close a channel",
     "en": "When finished, an **SSH_MSG_CHANNEL_CLOSE** message is sent to close the channel. **Closing the channel does not necessarily mean ending the whole SSH connection; the main connection can stay open to use other channels.**",
     "ar": "وعند الانتهاء يتم إرسال رسالة **إس إس إتش تشانل كلوز** لإغلاق القناة. **إغلاق القناة لا يعني بالضرورة إنهاء اتصال إس إس إتش بالكامل بل يمكن أن يبقى الاتصال الأساسي مفتوحًا لاستخدام قنوات أخرى**",
     "hot": true
    }
   ],
   "tl": null,
   "qs": [
    {
     "q": "Which message does the client send to request opening a channel?",
     "o": [
      "SSH_MSG_CHANNEL_OPEN",
      "SSH_MSG_CHANNEL_OPEN_CONFIRMATION",
      "SSH_MSG_CHANNEL_DATA",
      "SSH_MSG_CHANNEL_CLOSE"
     ],

<!-- ===================== 3. APP ===================== -->
<script>
'use strict';

/* ---------- 3.1 Constants and storage ---------- */
const PER_SLIDE = 5;
const LETTERS = ['A', 'B', 'C', 'D'];
let CH = null, SLIDES = [], TOTAL = 0, STORE_KEY = '';

const readP = key => {
  try { const o = JSON.parse(localStorage.getItem(key) || 'null'); if (o && o.best && o.wrong) return Object.assign({ reveal: {} }, o); } catch (e) {}
  return { best: {}, wrong: {}, reveal: {} };
};
let P = { best: {}, wrong: {}, reveal: {} };
const save = () => { if (!STORE_KEY) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) {} };

const PREFS_KEY = 'ch4-prefs';
/* Reading preferences: theme, text size, Arabic. Light + medium + Arabic on by default. */
let PREFS = { theme: 'light', size: 'm', arabic: true };
try { const o = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); if (o) PREFS = Object.assign(PREFS, o); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) {} };
function applyPrefs() {
  const h = document.documentElement;
  h.dataset.theme = ['light', 'warm', 'dark'].includes(PREFS.theme) ? PREFS.theme : 'light';
  h.dataset.size = ['s', 'm', 'l'].includes(PREFS.size) ? PREFS.size : 'm';
}

/* ---------- 3.2 State ---------- */
const S = {
  screen: 'chapters', // 'chapters' | 'home' | 'summary' | 'special'
  slide: 0,
  menu: false,         // reading-settings panel
  reveal: Object.assign({}, P.reveal),
  view: {},
  fresh: -1,
  ex: {},
  runs: {},
  special: null,
  nameEdit: false,
  resetArm: false
};

/* ---------- 3.3 Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const arabic = t => `<div class="ar" dir="rtl" lang="ar">${esc(t)}</div>`;
const prep = q => ({ ...q, opts: q.tf ? q.o.map((t, i) => ({ t, i })) : shuffle(q.o.map((t, i) => ({ t, i }))) });
const newRun = qs => ({ qs: qs.map(prep), i: 0, picked: null, score: 0, log: [], done: false, showExp: false });
const wrongCount = () => Object.keys(P.wrong).length;
const allQuestions = () => { const a = []; SLIDES.forEach(s => s.qs.forEach(q => a.push(q))); return a; };
const activeRun = () => (S.screen === 'special' ? S.special.run : S.runs[S.slide]);
const partsOf = i => SLIDES[i].items.length;
const revealedOf = i => Math.min(S.reveal[i] || 1, partsOf(i));
const revealed = () => Math.min(S.view[S.slide] || 1, partsOf(S.slide));
const finishedReading = () => revealed() >= partsOf(S.slide);
const smoothTo = (el, offset = 80) => { if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - offset, behavior: 'smooth' }); };

function loadChapter(id) {
  CH = CHAPTERS.find(c => c.id === id) || CHAPTERS[0];
  SLIDES = CH.slides; TOTAL = SLIDES.length * PER_SLIDE; STORE_KEY = CH.store;
  SLIDES.forEach((s, i) => s.qs.forEach((q, j) => { q.id = 's' + (i + 1) + 'q' + (j + 1); q.slide = i; }));
  P = readP(STORE_KEY);
  Object.assign(S, { reveal: Object.assign({}, P.reveal), view: {}, runs: {}, ex: {}, special: null, slide: 0, fresh: -1, resetArm: false });
}

/* ---------- 3.4 Reading settings (the "Aa" panel) ---------- */
const OPTIONS = {
  theme: [['light', 'Light'], ['warm', 'Warm'], ['dark', 'Dark']],
  size: [['s', 'A'], ['m', 'A+'], ['l', 'A++']],
  arabic: [['on', 'On'], ['off', 'Off']]
};
const current = k => (k === 'arabic' ? (PREFS.arabic ? 'on' : 'off') : PREFS[k]);
function menuHTML() {
  const row = (key, label) => `<div class="mrow"><span>${label}</span><div class="seg" role="group" aria-label="${label}">${
    OPTIONS[key].map(([v, t]) => `<button data-set="${key}:${v}" class="${current(key) === v ? 'on' : ''}" aria-pressed="${current(key) === v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="menu" id="menu" role="dialog" aria-label="Reading settings">
    <h4>Settings</h4>${row('theme', 'Theme')}${row('size', 'Text size')}${row('arabic', 'Arabic')}</div>`;
}
const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const barHTML = left => `<div class="bar">${left}<span class="menuwrap"><button class="gear" data-act="menu" aria-expanded="${S.menu}" aria-label="Reading settings" title="Settings">${GEAR}</button>${S.menu ? menuHTML() : ''}</span></div>`;
function applySetting(key, val) {
  if (key === 'arabic') { PREFS.arabic = val === 'on'; } else { PREFS[key] = val; }
  savePrefs(); applyPrefs();
  document.querySelectorAll('#menu [data-set]').forEach(b => { const [k, v] = b.dataset.set.split(':'); if (k === key) { b.classList.toggle('on', v === val); b.setAttribute('aria-pressed', v === val); } });
  if (key === 'arabic') render(true);       // text blocks change, keep scroll and menu
}

/* ---------- 3.5 Screens ---------- */
function render(keep) {
  const app = $('#app'), y = window.scrollY;
  app.innerHTML = S.screen === 'chapters' ? chaptersHTML() : S.screen === 'home' ? homeHTML() : S.screen === 'summary' ? slideHTML() : specialHTML();
  if (S.screen === 'summary' && finishedReading()) { buildExplore(); if (!S.runs[S.slide]) S.runs[S.slide] = newRun(SLIDES[S.slide].qs); renderQuiz(); }
  if (S.screen === 'special') renderQuiz();
  if (keep) window.scrollTo({ top: y, behavior: 'instant' });
}
function enter() { const a = $('#app'); a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter'); }

/* Chapter picker */
function chaptersHTML() {
  const rows = CHAPTERS.map(c => {
    const p = readP(c.store), m = Object.values(p.best).filter(v => v >= 4).length, n = c.slides.length;
    return `<li><button class="${m === n ? 'done' : ''}" data-chap="${c.id}"><span class="n">${c.num}</span>
      <span><span class="t">${esc(c.title)}</span><span class="m">${n} slides, ${n * PER_SLIDE} questions</span></span>
      <span class="s">${m ? m + '/' + n + ' mastered' : ''}</span><span class="go" aria-hidden="true">&rsaquo;</span></button></li>`;
  }).join('');
  return `${barHTML('<span class="crumb">Study rooms</span>')}
    <div class="kick">A study book</div>
    <h1>Security Study Rooms</h1>
    <p class="lead">Choose a chapter. Read each slide in small parts, explore it, then check your understanding.</p>
    ${nameHTML()}
    <h2 class="sec">Chapters</h2>
    <ul class="slides">${rows}</ul>`;
}

function nameHTML() {
  const name = Stats.name();
  if (name && !S.nameEdit) return `<div class="namebox" dir="rtl" lang="ar"><p class="hello">أهلًا <b>${esc(name)}</b><button class="text" data-act="editname">تغيير الاسم</button></p></div>`;
  return `<form class="namebox" id="nameform" dir="rtl" lang="ar" novalidate>
      <label for="nm">اكتب اسمك عشان نعرف مين استفاد</label>
      <div class="nrow"><input id="nm" name="nm" type="text" maxlength="${NAME_MAX}" autocomplete="name" spellcheck="false" value="${esc(name)}" placeholder="مثلًا: محمد العتيبي">
      <button class="btn sm pri" type="submit">حفظ</button>${name ? '<button class="btn sm" type="button" data-act="cancelname">إلغاء</button>' : ''}</div>
      <p class="nmerr" id="nmerr" role="alert"></p></form>`;
}

/* Home: summary, resume, slide list, then the tests */
function statusOf(i) {
  const b = P.best[i], n = revealedOf(i), total = partsOf(i);
  if (b !== undefined) return { txt: b + '/' + PER_SLIDE, done: b >= 4 };
  if (n > 1 || P.reveal[i]) return { txt: n >= total ? 'Questions left' : 'Part ' + n + ' of ' + total, done: false };
  return { txt: '', done: false };
}
function homeHTML() {
  const mastered = Object.values(P.best).filter(v => v >= 4).length;
  const wc = wrongCount(), last = P.last;
  const rows = SLIDES.map((s, i) => {
    const st = statusOf(i), tot = partsOf(i);
    return `${s.sec ? `<li class="secrow">${esc(s.sec)}</li>` : ''}<li><button class="${st.done ? 'done' : ''}" data-open="${i}"><span class="n">${i + 1}</span>
      <span><span class="t">${esc(s.title)}</span><span class="m">${tot} parts, ${PER_SLIDE} questions</span></span>
      <span class="s">${esc(st.txt)}</span><span class="go" aria-hidden="true">&rsaquo;</span></button></li>`;
  }).join('');
  const resume = last !== undefined && SLIDES[last] ? `<button class="resume" data-open="${last}"><span>Resume: ${esc(SLIDES[last].title)}<small>Slide ${last + 1}, part ${revealedOf(last)} of ${partsOf(last)}</small></span><span aria-hidden="true">&rarr;</span></button>` : '';
  return `${barHTML('<button class="text" data-act="chapters">&larr; All chapters</button>')}
    <div class="kick">Chapter ${CH.num}</div>
    <h1>${esc(CH.title)}</h1>
    <p class="lead">Read each slide in small parts, explore it, then check your understanding.</p>
    <div class="stats">
      <div class="stat"><b>${mastered}/${SLIDES.length}</b><span>Slides mastered</span><div class="tr"><i style="width:${mastered / SLIDES.length * 100}%"></i></div></div>
      <div class="stat"><b>${P.exam !== undefined ? P.exam + '/' + TOTAL : '-'}</b><span>Best full exam</span></div>
      <div class="stat"><b>${wc}</b><span>To review</span></div>
    </div>
    ${resume}
    <h2 class="sec">Contents</h2>
    <ul class="slides">${rows}</ul>
    <h2 class="sec">Test yourself</h2>
    <div class="tests">
      <button class="tcard pri" data-act="final"><b>Full exam</b><span>All ${TOTAL} questions, random order</span></button>
      <button class="tcard" data-act="review" ${wc ? '' : 'disabled'}><b>Review mistakes</b><span>${wc ? wc + ' question' + (wc === 1 ? '' : 's') + ' you missed' : 'Nothing to review yet'}</span></button>
    </div>
    <div class="foot-note"><span></span><button class="text" data-act="reset">${S.resetArm ? 'Click again to reset' : 'Reset progress'}</button></div>`;
}

/* One slide: read part by part, explore, then answer the questions */
function slideHTML() {
  const sl = SLIDES[S.slide], total = sl.items.length, n = revealed(), done = n >= total;
  const parts = sl.items.slice(0, n).map((it, k) => `<section class="item ${it.hot ? 'hot' : ''} ${k === S.fresh ? 'new' : ''}">
      ${it.h ? `<h3>${esc(it.h)}</h3>` : ''}
      <p class="en">${bold(it.en)}</p>
      ${PREFS.arabic ? `<p class="ar" dir="rtl" lang="ar">${bold(it.ar)}</p>` : ''}</section>`).join('');
  const cont = done ? '' : `<div class="cont">
      <button class="btn pri" id="contbtn" data-act="more"><span class="arb">المعلومة التالية</span></button>
      <button class="btn" data-act="all"><span class="arb">اعرض السلايد كامل</span></button></div>`;
  const tail = done ? `
    ${total > 1 ? `<div class="cont"><button class="text" data-act="step"><span class="arb">&#8635; اعرض معلومة معلومة</span></button></div>` : ''}
    ${(sl.figs || []).map(f => `<figure class="fig"><img src="${f.src}" alt="${esc(f.alt)}" style="max-width:${f.w}px" loading="lazy"></figure>`).join('')}
    ${sl.tl ? `<div class="take"><h3>Takeaway</h3><div>${esc(sl.tl.en)}</div>${PREFS.arabic ? arabic(sl.tl.ar) : ''}</div>` : ''}
    <section class="explore" id="explore"><h3>${esc(sl.explore.title)}</h3>
      <p class="sub">${sl.explore.mode === 'steps' ? 'Tap a step, or use Next step.' : 'Tap an option to explore it.'}</p>
      <div id="exbox"></div></section>
    <section class="check" id="check"><h3>Check your understanding</h3>
      <p class="sub">${PER_SLIDE} questions on this slide</p><div id="qbox"></div></section>
    <div class="row-btns" style="margin-top:2.1rem;gap:1.4rem">
      <button class="text" data-go="${S.slide - 1}" ${S.slide === 0 ? 'hidden' : ''}>&larr; Previous slide</button>
      <button class="text" data-go="${S.slide + 1}" ${S.slide === SLIDES.length - 1 ? 'hidden' : ''}>Next slide &rarr;</button>
    </div>` : '';
  return `${barHTML('<button class="text" data-act="home">&larr; All slides</button>')}
    <h2>${esc(sl.title)}</h2>
    <div class="pos"><span>Slide ${S.slide + 1} of ${SLIDES.length}. Part ${n} of ${total}</span><div class="tr"><i style="width:${Math.round(n / total * 100)}%"></i></div></div>
    ${parts}${cont}${tail}
    <div class="folio"><span>Chapter ${CH.num} · ${esc(CH.title)}</span><b>${S.slide + 1}</b></div>`;
}

/* ---------- 3.6 Explorer (built once, then updated in place) ---------- */
function buildExplore() {
  const box = $('#exbox'); if (!box) return;
  const ex = SLIDES[S.slide].explore, steps = ex.mode === 'steps', last = ex.nodes.length - 1;
  const pills = ex.nodes.map((n, k) => `<button class="pill" data-ex="${k}">${steps ? `<b>${k + 1}</b>` : ''}${esc(n.k)}</button>${steps && k < last ? '<span class="sep" aria-hidden="true">&rsaquo;</span>' : ''}`).join('');
  const nav = steps ? `<button class="text" data-exstep="-1">&larr; Back</button><button class="btn sm pri" data-exstep="1">Next step</button>` : '';
  box.innerHTML = `<div class="pills">${pills}</div><div class="detail" id="exdetail" aria-live="polite"></div><div class="exnav" id="exnav">${nav}</div><div class="foot" id="exfoot"></div>`;
  updateExplore(false);
}
function updateExplore(animate) {
  const ex = SLIDES[S.slide].explore, sel = S.ex[S.slide] || 0, steps = ex.mode === 'steps', last = ex.nodes.length - 1;
  document.querySelectorAll('#exbox .pill').forEach((p, k) => {
    p.classList.toggle('on', k === sel); p.classList.toggle('past', steps && k < sel); p.setAttribute('aria-pressed', k === sel);
  });
  const n = ex.nodes[sel], d = $('#exdetail');
  d.innerHTML = `<div class="${animate ? 'fbin' : ''}"><p class="en">${esc(n.en)}</p>${PREFS.arabic ? `<p class="ar" dir="rtl" lang="ar">${esc(n.ar)}</p>` : ''}${n.html ? `<div class="dg">${n.html}</div>` : ''}</div>`;
  const back = $('#exnav [data-exstep="-1"]'), nxt = $('#exnav [data-exstep="1"]');
  if (back) back.disabled = sel === 0;
  if (nxt) nxt.disabled = sel === last;
  $('#exfoot').innerHTML = ex.foot && (!steps || sel === last) ? `<div class="${animate ? 'fbin' : ''}">${esc(ex.foot.en)}${PREFS.arabic ? arabic(ex.foot.ar) : ''}</div>` : '';
}
function exSelect(k) {
  const n = SLIDES[S.slide].explore.nodes.length;
  S.ex[S.slide] = Math.max(0, Math.min(n - 1, k)); updateExplore(true);
}

/* ---------- 3.7 Full exam / mistakes review ---------- */
function specialHTML() {
  const sp = S.special, n = sp.run.qs.length;
  return `${barHTML('<button class="text" data-act="home">&larr; All slides</button>')}
    <h2 style="margin-bottom:.4rem">${sp.kind === 'full' ? 'Full exam' : 'Review mistakes'}</h2>
    <p class="lead" style="margin:0 0 1.6rem">${sp.kind === 'full' ? `All ${n} questions in random order. Press 1 to 4 on the keyboard to answer.` : `${n} question${n === 1 ? '' : 's'} you missed before.`}</p>
    <div id="qbox"></div>`;
}

/* ---------- 3.8 Quiz (feedback is added in place, so nothing flickers) ---------- */
function renderQuiz() {
  const run = activeRun(), box = $('#qbox');
  if (!run || !box) return;
  box.innerHTML = `<div class="swap">${run.done ? resultHTML(run) : questionHTML(run)}</div>`;
}
function feedbackHTML(run) {
  const q = run.qs[run.i], ok = run.log[run.i].ok, last = run.i === run.qs.length - 1;
  const correct = q.opts.find(o => o.i === q.a).t;
  const next = `<div class="row-btns" style="margin-top:1.3rem"><button class="btn pri" id="nextbtn" data-next="1">${last ? 'See results' : 'Next question'}</button></div>`;
  if (ok) {
    return `<div class="verdict good" role="status">Correct</div>
      ${run.showExp ? `<div class="why"><h4>Explanation</h4>${arabic(q.e)}</div>` : '<button class="text" data-exp="1">Show explanation</button>'}${next}`;
  }
  const mine = q.opts[run.picked].i;
  const note = q.w && q.w[mine] ? `<div class="why"><h4>Why your answer is wrong</h4>${arabic(q.w[mine])}</div>` : '';
  return `<div class="verdict bad" role="status">Not quite</div>
    <div class="ans">Correct answer: ${esc(correct)}</div>
    <div class="why"><h4>Explanation</h4>${arabic(q.e)}</div>${note}${next}`;
}
function questionHTML(run) {
  const q = run.qs[run.i], n = run.qs.length, answered = run.picked !== null;
  const pct = Math.round((run.i + (answered ? 1 : 0)) / n * 100);
  const opts = q.opts.map((o, k) => {
    let cls = '';
    if (answered) cls = o.i === q.a ? 'right' : (k === run.picked ? 'wrong' : 'dim');
    return `<button class="opt ${cls}" data-pick="${k}" ${answered ? 'disabled' : ''}>
      <span class="l">${q.tf ? (o.t === 'True' ? 'T' : 'F') : LETTERS[k]}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  const tag = S.screen === 'special' ? `<span>Slide ${q.slide + 1}</span>` : '<span></span>';
  return `<div class="qmeta"><span>Question ${run.i + 1} of ${n}</span>${tag}</div>
    <div class="track" aria-hidden="true"><i id="qfill" style="width:${pct}%"></i></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts" role="group" aria-label="Answer options">${opts}</div>
    <div id="fb">${answered ? feedbackHTML(run) : ''}</div>`;
}
function resultHTML(run) {
  const n = run.qs.length, s = run.score, r = s / n;
  const msg = r === 1 ? 'Every answer was correct.' : r >= .8 ? 'Very good, almost there.' : r >= .6 ? 'Good. Review the points you missed.' : 'Read the slide again and retry.';
  const missed = run.qs.map((q, k) => ({ q, k })).filter(x => !(run.log[x.k] && run.log[x.k].ok));
  const list = missed.length ? `<div class="missed"><h3>Questions to review</h3>${missed.map(({ q }) => `
      <div class="mi"><div class="q">${esc(q.q)}</div>
      <div class="a">Correct answer: ${esc(q.opts.find(o => o.i === q.a).t)}</div>${arabic(q.e)}</div>`).join('')}</div>` : '';
  let breakdown = '';
  if (S.screen === 'special' && S.special.kind === 'full') {
    const by = SLIDES.map(() => ({ ok: 0, n: 0 }));
    run.qs.forEach((q, k) => { by[q.slide].n++; if (run.log[k] && run.log[k].ok) by[q.slide].ok++; });
    breakdown = `<div class="bk"><h3>Score by slide</h3>${by.map((b, i) => `<div class="r"><span>${i + 1}</span><span>${esc(SLIDES[i].title)}</span>
      <span class="${b.ok === b.n ? 'top' : b.ok <= 2 ? 'low' : ''}">${b.ok}/${b.n}</span></div>`).join('')}</div>`;
  }
  const acts = S.screen === 'special'
    ? `<button class="btn pri" data-restart="1">${S.special.kind === 'full' ? 'New exam' : 'Review again'}</button><button class="btn" data-act="home">All slides</button>`
    : `<button class="btn pri" data-restart="1">Retry these questions</button>
       ${S.slide < SLIDES.length - 1 ? `<button class="btn" data-go="${S.slide + 1}">Next slide</button>` : '<button class="btn" data-act="home">All slides</button>'}`;
  return `<div class="score">${s}<small>/${n}</small></div><div class="msg">${msg}</div>
    <div class="row-btns">${acts}</div>${breakdown}${list}`;
}

/* ---------- 3.9 Actions ---------- */
function go(screen, extra) {
  Object.assign(S, { screen, fresh: -1, menu: false }, extra || {});
  if (screen === 'summary') { P.last = S.slide; S.view[S.slide] = 1; save(); Stats.learn(CH.id); }
  render(); enter(); window.scrollTo({ top: 0, behavior: 'instant' });
}
function revealMore(all) {
  const total = partsOf(S.slide), cur = revealed();
  const nv = all ? total : Math.min(total, cur + 1);
  S.view[S.slide] = nv;
  S.reveal[S.slide] = P.reveal[S.slide] = Math.max(P.reveal[S.slide] || 1, nv);
  S.fresh = all ? -1 : cur; save();
  render(true);
  S.fresh = -1;
  if (all) smoothTo($('#explore'), 70);
  else { const el = document.querySelectorAll('.item')[cur]; smoothTo(el, Math.round(window.innerHeight * 0.28)); }
}
function stepMode() {
  S.view[S.slide] = 1; S.fresh = 0;
  render(true); S.fresh = -1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function startSpecial(kind) {
  let qs;
  if (kind === 'full') qs = shuffle(allQuestions());
  else { const ids = Object.keys(P.wrong); qs = shuffle(allQuestions().filter(q => ids.includes(q.id))); if (!qs.length) return; }
  S.special = { kind, run: newRun(qs) };
  go('special');
}
function pick(k) {
  const run = activeRun();
  if (!run || run.done || run.picked !== null) return;
  const q = run.qs[run.i], ok = q.opts[k].i === q.a;
  run.picked = k; run.log[run.i] = { ok, id: q.id };
  if (ok) { run.score++; delete P.wrong[q.id]; } else { P.wrong[q.id] = 1; }
  save();
  // update in place: same buttons, new classes, feedback fades in
  document.querySelectorAll('#qbox .opt').forEach((b, idx) => {
    b.disabled = true; b.classList.add(q.opts[idx].i === q.a ? 'right' : idx === k ? 'wrong' : 'dim');
  });
  const fill = $('#qfill'); if (fill) fill.style.width = Math.round((run.i + 1) / run.qs.length * 100) + '%';
  const fb = $('#fb'); if (fb) fb.innerHTML = `<div class="fbin">${feedbackHTML(run)}</div>`;
  const nb = $('#nextbtn'); if (nb) nb.focus({ preventScroll: true });
}
function showExplanation() {
  const run = activeRun(); run.showExp = true;
  const fb = $('#fb'); if (fb) fb.innerHTML = `<div class="fbin">${feedbackHTML(run)}</div>`;
  const nb = $('#nextbtn'); if (nb) nb.focus({ preventScroll: true });
}
function next() {
  const run = activeRun();
  if (!run || run.picked === null) return;
  if (run.i === run.qs.length - 1) {
    run.done = true;
    if (S.screen === 'summary') { P.best[S.slide] = Math.max(P.best[S.slide] || 0, run.score); Stats.quiz(CH.id); }
    else if (S.special.kind === 'full') { P.exam = Math.max(P.exam || 0, run.score); Stats.exam(CH.id, run.score); }
    save();
  } else { run.i++; run.picked = null; run.showExp = false; }
  renderQuiz();
  if (S.screen === 'special') window.scrollTo({ top: 0, behavior: 'smooth' });
  else smoothTo($('#check'), 40);
}
function restart() {
  if (S.screen === 'special') return startSpecial(S.special.kind);
  S.runs[S.slide] = newRun(SLIDES[S.slide].qs); renderQuiz(); smoothTo($('#check'), 40);
}
function resetProgress() {
  if (!S.resetArm) { S.resetArm = true; render(true); setTimeout(() => { if (S.resetArm) { S.resetArm = false; if (S.screen === 'home') render(true); } }, 3500); return; }
  P = { best: {}, wrong: {}, reveal: {} }; save(); S.runs = {}; S.reveal = {}; S.view = {}; S.ex = {}; S.resetArm = false; render();
}
function closeMenu() { if (S.menu) { S.menu = false; render(true); } }

/* ---------- 3.10b Anonymous usage stats (Firebase Realtime Database, REST) ----------
   What is sent: a random device id, timestamps, counters, chapter ids from the fixed list,
   and an optional name that passed the filter below. No user text ever goes into a path,
   so nothing typed can change where data is written. Everything shown on screen is escaped. */
const STATS_DB = 'https://footba-2993c-default-rtdb.firebaseio.com/studyRooms';
const NAME_MIN = 2, NAME_MAX = 30;

/* Name filter: letters only, real-looking, nothing rude. */
const NameCheck = (() => {
  const LETTER_WORD = /^(?:[A-Za-z]+|[ء-غف-ي]+)$/;
  // fold so that spelling tricks match: diacritics, tatweel, alef forms, taa marbuta, repeated letters
  const fold = s => s.toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/(.)\1+/g, '$1');
  // rude words: matched anywhere (after removing spaces)
  const RUDE_ANY = ['fuck', 'shit', 'bitch', 'cunt', 'pussy', 'asshole', 'whore', 'slut', 'nigger', 'nigga', 'faggot', 'porn', 'penis', 'vagina', 'dildo', 'rapist', 'hitler',
    'شرموط', 'قحب', 'منيوك', 'متناك', 'منتاك', 'طيز', 'عرص', 'ديوث', 'لوطي', 'خنيث', 'زاني', 'زانيه', 'سكس', 'نياك', 'مخنث', 'ابنالكلب', 'ابنالحرام', 'يلعن', 'كسمك', 'كسختك', 'كسامك',
    'اهينك', 'اهينكم', 'عنالكل', 'عمالكل', 'عمكم', 'عمكو', 'ابوكم', 'سيدكم', 'اسيادك', 'اسيادكم', 'زعيمكم'];
  // rude or silly words: matched as a whole word only, so real names are not caught by accident
  const RUDE_WORD = ['dick', 'cock', 'sex', 'fag', 'bastard', 'damn', 'idiot', 'stupid', 'dumb', 'loser', 'moron', 'donkey', 'pig', 'dog', 'ass', 'boob', 'boobs', 'rape', 'nazi',
    'كس', 'زب', 'زق', 'نيك', 'خرا', 'خري', 'زفت', 'حمار', 'كلب', 'خنزير', 'حيوان', 'غبي', 'غبيه', 'اهبل', 'هبله', 'تافه', 'حقير', 'وسخ', 'وصخ', 'قذر', 'خول', 'حماره', 'كلبه', 'بهيمه', 'ثور', 'تيس', 'قرد', 'جحش', 'دب',
    'عمك', 'ابوك', 'سيدك', 'زعيمك', 'جدك', 'boss', 'daddy', 'king', 'legend'];
  const SILLY = ['test', 'tests', 'testing', 'tester', 'asdf', 'asd', 'qwe', 'qwer', 'qwerty', 'zxc', 'abc', 'abcd', 'xx', 'xxx', 'lol', 'lmao', 'haha', 'hh', 'admin', 'root', 'user', 'name', 'myname', 'null', 'undefined', 'none', 'nobody', 'anonymous', 'anon', 'unknown', 'nothing', 'guest', 'hello', 'hi', 'no', 'yes', 'ok', 'bot', 'god',
    'تست', 'تجربه', 'تجربا', 'مدري', 'مادري', 'ماادري', 'ماعرف', 'مااعرف', 'لا', 'ولا', 'يوجد', 'اي', 'نعم', 'احد', 'محد', 'ولااحد', 'بدون', 'اسم', 'اسمي', 'مجهول', 'لايوجد', 'لاشي', 'ولاشي', 'شي', 'هه', 'ههه', 'خخ', 'اهلا', 'مرحبا', 'الله', 'ربي', 'زائر', 'ضيف', 'طالبه', 'انا', 'انت', 'هو', 'هي', 'الكل', 'عن'];
  const anyRude = new Set(RUDE_ANY.map(fold)), wordRude = new Set(RUDE_WORD.map(fold)), silly = new Set(SILLY.map(fold));
  // extra words the owner bans from the Firebase console (studyRooms/bannedWords), matched anywhere
  let extra = new Set();
  function setExtra(list) {
    extra = new Set(list.filter(w => typeof w === 'string' && w.length <= 40)
      .map(w => fold(clean(w)).replace(/ /g, '')).filter(w => w.length >= 2));
  }
  const clean = raw => String(raw == null ? '' : raw).normalize('NFKC')
    .replace(/[ً-ٰٟـ​-‏‪-‮⁦-⁩﻿]/g, '')
    .replace(/\s+/g, ' ').trim();
  function check(raw) {
    const name = clean(raw);
    if (!name) return { ok: false, msg: 'اكتب اسمك أولًا.' };
    if (name.length < NAME_MIN || name.length > NAME_MAX) return { ok: false, msg: `الاسم لازم يكون من ${NAME_MIN} إلى ${NAME_MAX} حرف.` };
    const words = name.split(' ');
    if (words.length > 4) return { ok: false, msg: 'اكتب اسمك بأربع كلمات أو أقل.' };
    if (!words.every(w => LETTER_WORD.test(w))) return { ok: false, msg: 'اكتب الاسم بحروف عربية أو إنجليزية فقط، بدون أرقام أو رموز.' };
    if (words.some(w => w.length < 2)) return { ok: false, msg: 'كل كلمة في الاسم لازم تكون حرفين أو أكثر.' };
    const folded = words.map(fold), joined = folded.join('');
    const rude = [...anyRude].some(r => joined.includes(r)) || folded.some(w => wordRude.has(w)) || [...extra].some(r => joined.includes(r));
    if (rude) return { ok: false, msg: 'هذا الاسم غير مناسب. اكتب اسمك الحقيقي.' };
    const latin = words.filter(w => /^[A-Za-z]+$/.test(w));
    const mashed = latin.some(w => w.length >= 4 && !/[aeiouy]/i.test(w));
    const repeated = words.some(w => /(.)\1\1/i.test(w)) || words.some(w => new Set(w.toLowerCase()).size === 1);
    if (folded.every(w => silly.has(w)) || mashed || repeated)
      return { ok: false, msg: 'اكتب اسمك الحقيقي من فضلك.' };
    return { ok: true, name };
  }
  return { check, setExtra };
})();

const Stats = (() => {
  const KEY = 'sr-stats-v1', SESSION = 'sr-stats-session';
  const INC = { '.sv': { increment: 1 } }, NOW = { '.sv': 'timestamp' };
  const newId = () => {
    const b = new Uint8Array(16);
    try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256); }
    return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const validId = s => typeof s === 'string' && /^[A-Za-z0-9_-]{22}$/.test(s);
  const validCh = s => typeof s === 'string' && /^ch[0-9]{1,2}$/.test(s);
  let st = null;
  try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!st || !validId(st.id) || typeof st.f !== 'object' || !st.f) st = { id: newId(), f: {}, name: '' };
  if (typeof st.name !== 'string' || !NameCheck.check(st.name).ok) st.name = '';
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  persist();
  const me = k => `people/${st.id}/${k}`;

  // one request at a time, so the "already counted" flags never race
  let chain = Promise.resolve();
  const queue = job => { chain = chain.then(job).catch(() => {}); return chain; };
  async function send(updates) {
    try {
      const r = await fetch(`${STATS_DB}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates), keepalive: true, cache: 'no-store' });
      return r.ok ? 'ok' : (r.status === 401 || r.status === 403) ? 'denied' : 'error';
    } catch (e) { return 'error'; }
  }
  const flag = k => { st.f[k] = 1; persist(); };

  function visit() {
    let first = true;
    try { first = !sessionStorage.getItem(SESSION); sessionStorage.setItem(SESSION, '1'); } catch (e) {}
    if (!first) return;
    queue(async () => {
      if (!st.f.v) {
        const r = await send({ [me('first')]: NOW, [me('last')]: NOW, [me('visits')]: INC, 'counts/visitors': INC, 'counts/visits': INC });
        if (r === 'ok') { flag('v'); return; }
        if (r !== 'denied') return;
        flag('v');                     // the record already exists: count this as a normal visit
      }
      await send({ [me('last')]: NOW, [me('visits')]: INC, 'counts/visits': INC });
    });
    loadBanned();
  }
  // words the owner banned in the console; a saved name that now matches is dropped
  function loadBanned() {
    fetch(`${STATS_DB}/bannedWords.json`, { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(o => {
        if (!o || typeof o !== 'object') return;
        NameCheck.setExtra(Object.keys(o).slice(0, 1000));
        if (st.name && !NameCheck.check(st.name).ok) { st.name = ''; delete st.f.n; persist(); if (onDrop) onDrop(); }
      })
      .catch(() => {})
      .then(() => { if (st.name && !st.f.n) setName(st.name); });
  }
  let onDrop = null;
  function learn(ch) {
    if (!validCh(ch)) return;
    queue(async () => {
      const u = {};
      if (!st.f.l) u['counts/learners'] = INC;
      if (!st.f['l:' + ch]) { u[`chapters/${ch}/learners`] = INC; u[me('chapters/' + ch)] = true; }
      if (!Object.keys(u).length) return;
      if (await send(u) === 'ok') { flag('l'); flag('l:' + ch); }
    });
  }
  function quiz(ch) {
    if (!validCh(ch)) return;
    queue(async () => {
      const u = { 'counts/quizzes': INC, [`chapters/${ch}/quizzes`]: INC, [me('quizzes')]: INC };
      if (!st.f.s) u['counts/solvers'] = INC;
      if (!st.f['s:' + ch]) u[`chapters/${ch}/solvers`] = INC;
      if (await send(u) === 'ok') { flag('s'); flag('s:' + ch); }
    });
  }
  function exam(ch, score) {
    if (!validCh(ch)) return;
    const n = Math.max(0, Math.min(500, Math.floor(Number(score) || 0)));
    queue(async () => {
      const best = Math.max(n, Number(st.f['b:' + ch]) || 0);
      const u = { 'counts/exams': INC, [`chapters/${ch}/exams`]: INC, [me('exams')]: INC, [me('best/' + ch)]: best };
      if (!st.f.s) u['counts/solvers'] = INC;
      if (!st.f['s:' + ch]) u[`chapters/${ch}/solvers`] = INC;
      if (await send(u) === 'ok') { st.f['b:' + ch] = best; flag('s'); flag('s:' + ch); }
    });
  }
  async function setName(raw) {
    const c = NameCheck.check(raw);
    if (!c.ok) return c;
    let res = 'error';
    await queue(async () => { res = await send({ [me('name')]: c.name }); });
    if (res === 'denied') { st.name = ''; delete st.f.n; persist(); return { ok: false, msg: 'ما نقدر نحفظ هذا الاسم.' }; }
    st.name = c.name;
    if (res === 'ok') st.f.n = 1; else delete st.f.n;   // offline: try again on the next visit
    persist();
    return c;
  }
  return { visit, learn, quiz, exam, setName, name: () => st.name, onNameDropped: fn => { onDrop = fn; } };
})();

/* ---------- 3.10 Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (S.menu && !e.target.closest('.menuwrap')) closeMenu();
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.set) { const [k, v] = d.set.split(':'); return applySetting(k, v); }
  if (d.chap) { loadChapter(d.chap); return go('home'); }
  if (d.open !== undefined) return go('summary', { slide: +d.open });
  if (d.go !== undefined) return go('summary', { slide: +d.go });
  if (d.ex !== undefined) return exSelect(+d.ex);
  if (d.exstep) return exSelect((S.ex[S.slide] || 0) + +d.exstep);
  if (d.pick !== undefined) return pick(+d.pick);
  if (d.next) return next();
  if (d.exp) return showExplanation();
  if (d.restart) return restart();
  switch (d.act) {
    case 'home': return go('home');
    case 'chapters': return go('chapters');
    case 'more': return revealMore(false);
    case 'all': return revealMore(true);
    case 'step': return stepMode();
    case 'final': return startSpecial('full');
    case 'review': return startSpecial('review');
    case 'menu': S.menu = !S.menu; return render(true);
    case 'reset': return resetProgress();
    case 'editname': S.nameEdit = true; render(true); { const i = $('#nm'); if (i) i.focus(); } return;
    case 'cancelname': S.nameEdit = false; return render(true);
  }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') return closeMenu();
  // Reading: Enter or Right Arrow = Continue (only when nothing else has focus)
  if (S.screen === 'summary' && !finishedReading() && (e.key === 'Enter' || e.key === 'ArrowRight') && document.activeElement === document.body) { e.preventDefault(); return revealMore(false); }
  // Exam / review: 1-4 answer (never on slide pages, so reading cannot trigger answers)
  if (S.screen !== 'special') return;
  const run = activeRun();
  if (!run || run.done || run.picked !== null) return;
  const idx = ['1', '2', '3', '4'].indexOf(e.key);
  if (idx >= 0 && idx < run.qs[run.i].opts.length) pick(idx);
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'nameform') return;
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  const r = await Stats.setName($('#nm').value);
  if (btn) btn.disabled = false;
  if (!r.ok) { const er = $('#nmerr'); if (er) er.textContent = r.msg; const i = $('#nm'); if (i) i.focus(); return; }
  S.nameEdit = false; if (S.screen === 'chapters') render(true);
});

/* ---------- 3.11 Init ---------- */
applyPrefs();
Stats.onNameDropped(() => { if (S.screen === 'chapters') render(true); });
Stats.visit();
render();
enter();
</script>
