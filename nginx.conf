server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the pages are large single files: compress them on the way out
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # pages always revalidate, so a new image is seen at once; downloads may be cached
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location ~* \.(pdf|docx)$ { add_header Cache-Control "public, max-age=604800"; }

    # never serve the admin page or the database rules, even if a copy ends up in the folder
    location = /admin.html { return 404; }
    location = /database.rules.json { return 404; }

    location / { try_files $uri $uri/ =404; }
}
