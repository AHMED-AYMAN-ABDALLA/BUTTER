# the address the site is reached on (behind a proxy or Cloudflare too), for the sitemap and the canonical link
map $http_x_forwarded_proto $site_proto { default $http_x_forwarded_proto; "" $scheme; }
map $uri $canon_path { /index.html /; default $uri; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the pages are large single files: compress them on the way out
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # pages always revalidate, so a new image is seen at once; downloads may be cached
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location ~* \.(pdf|docx)$ { add_header Cache-Control "public, max-age=604800"; }

    # never serve the admin page or the database rules, even if a copy ends up in the folder
    location = /admin.html { return 404; }
    location = /database.rules.json { return 404; }

    # search: one address for every page, and the names people search for («زبدة», «زبده», «منصة زبدة»)
    sub_filter_once on;
    sub_filter '<!--seo-->' '<!--seo--><link rel="canonical" href="$site_proto://$host$canon_path"><meta property="og:url" content="$site_proto://$host$canon_path"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"زبدة","alternateName":["زبده","منصة زبدة","منصة زبده","Zubdah"],"url":"$site_proto://$host/","inLanguage":"ar"}</script>';

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /admin.html\nDisallow: /database.rules.json\nSitemap: $site_proto://$host/sitemap.xml\n";
    }
    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>$site_proto://$host/</loc><priority>1.0</priority><changefreq>weekly</changefreq></url>\n<url><loc>$site_proto://$host/coop.html</loc><priority>0.8</priority><changefreq>weekly</changefreq></url>\n<url><loc>$site_proto://$host/career.html</loc><priority>0.8</priority><changefreq>monthly</changefreq></url>\n<url><loc>$site_proto://$host/general.html</loc><priority>0.6</priority><changefreq>monthly</changefreq></url>\n<url><loc>$site_proto://$host/quran.html</loc><priority>0.5</priority><changefreq>monthly</changefreq></url>\n<url><loc>$site_proto://$host/iot.html</loc><priority>0.5</priority><changefreq>monthly</changefreq></url>\n<url><loc>$site_proto://$host/security.html</loc><priority>0.5</priority><changefreq>monthly</changefreq></url>\n</urlset>\n';
    }

    location / { try_files $uri $uri/ =404; }
}
